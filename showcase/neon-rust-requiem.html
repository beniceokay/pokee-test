<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NEON RUST REQUIEM</title>
<style>
:root{
  --void:#07040d; --violet:#2a0f3d; --magenta:#ff2bd6; --cyan:#3df7ff;
  --rust:#c2551f; --lime:#b6ff3b; --bone:#f2e9f7;
  --mono:'Courier New',ui-monospace,Menlo,Consolas,monospace;
  --serif:Georgia,'Times New Roman',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--void);overflow:hidden;
  font-family:var(--mono);color:var(--bone);
  -webkit-user-select:none;user-select:none;touch-action:none;
  -webkit-tap-highlight-color:transparent;cursor:crosshair;}
#stage{position:fixed;inset:0}
canvas{position:absolute;inset:0;display:block}
#fx{pointer-events:none}
/* ---------- overlays ---------- */
.ui{position:absolute;inset:0;pointer-events:none;z-index:20}
.hud{position:absolute;font-family:var(--mono);font-size:13px;letter-spacing:.14em;
  text-shadow:0 0 8px rgba(255,43,214,.6),0 0 2px #000;pointer-events:none}
#score{top:16px;left:24px}
#score b{font-size:22px;color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
#combo{top:16px;right:24px;text-align:right}
#combo b{font-size:26px;color:var(--magenta);text-shadow:0 0 12px var(--magenta)}
#sync{top:16px;left:50%;transform:translateX(-50%);text-align:center}
#sync b{font-size:20px;color:var(--lime);text-shadow:0 0 10px var(--lime)}
#sector{bottom:20px;left:24px;max-width:40vw;line-height:1.5}
#sector .t{color:var(--rust);font-size:11px}
#sector .n{color:var(--bone);font-size:15px}
#power{bottom:20px;right:24px;text-align:right;line-height:1.5}
#power .p{color:var(--cyan)}
#halo{top:64px;left:24px;display:flex;gap:7px;pointer-events:none}
#halo .shard{width:16px;height:22px;
  clip-path:polygon(50% 0,100% 30%,78% 100%,22% 100%,0 30%);
  background:linear-gradient(180deg,var(--magenta),var(--violet));
  box-shadow:0 0 10px var(--magenta);transition:all .2s}
#halo .shard.off{background:#1a1024;box-shadow:none;opacity:.4;
  transform:translateY(6px) rotate(8deg)}
/* gothic HUD frame */
#hudFrame{position:absolute;inset:12px;pointer-events:none;opacity:.5}
#hudFrame .c{position:absolute;width:26px;height:26px;border:1px solid rgba(255,43,214,.5)}
#hudFrame .c.tl{top:0;left:0;border-right:none;border-bottom:none}
#hudFrame .c.tr{top:0;right:0;border-left:none;border-bottom:none}
#hudFrame .c.bl{bottom:0;left:0;border-right:none;border-top:none}
#hudFrame .c.br{bottom:0;right:0;border-left:none;border-top:none}
#hudFrame .c::after{content:'';position:absolute;width:8px;height:8px;background:var(--magenta);
  box-shadow:0 0 8px var(--magenta)}
#hudFrame .c.tl::after{top:-1px;left:-1px}
#hudFrame .c.tr::after{top:-1px;right:-1px}
#hudFrame .c.bl::after{bottom:-1px;left:-1px}
#hudFrame .c.br::after{bottom:-1px;right:-1px}
/* ---------- title / boot / menus ---------- */
.center{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;pointer-events:none}
.big{font-family:var(--serif);letter-spacing:.42em;font-weight:400;
  text-transform:uppercase;line-height:1.05}
#boot{pointer-events:auto;cursor:pointer}
#boot .pulse{font-family:var(--mono);letter-spacing:.34em;font-size:15px;
  color:var(--bone);animation:pulse 1.6s ease-in-out infinite}
#boot .sub{margin-top:26px;font-size:11px;letter-spacing:.28em;color:#7a6a92}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
#skip{position:absolute;bottom:20px;right:22px;z-index:40;pointer-events:auto;
  font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--cyan);
  background:rgba(10,6,20,.5);border:1px solid rgba(61,247,255,.4);
  padding:8px 14px;cursor:pointer;backdrop-filter:blur(2px)}
#skip:hover{background:rgba(61,247,255,.15);box-shadow:0 0 16px rgba(61,247,255,.4)}
#mute{position:absolute;top:64px;right:24px;z-index:40;pointer-events:auto;
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#8a7aa2;
  border:1px solid rgba(138,122,162,.3);padding:6px 10px;cursor:pointer;
  background:rgba(10,6,20,.4);backdrop-filter:blur(2px)}
#mute:hover{color:var(--bone);border-color:var(--magenta)}
#menu{background:radial-gradient(ellipse at center,rgba(42,15,61,.5),rgba(7,4,13,.82));
  backdrop-filter:blur(3px);pointer-events:auto}
#menu .ttl{font-family:var(--serif);font-size:44px;letter-spacing:.3em;
  color:var(--bone);text-shadow:0 0 24px var(--magenta),3px 0 0 var(--magenta),-3px 0 0 var(--cyan);
  margin-bottom:8px}
#menu .sub2{font-size:12px;letter-spacing:.3em;color:var(--rust);margin-bottom:34px}
.mrow{display:flex;flex-direction:column;gap:14px;align-items:center}
.mbtn{font-family:var(--mono);font-size:14px;letter-spacing:.24em;color:var(--bone);
  background:transparent;border:1px solid rgba(255,43,214,.45);
  padding:12px 40px;cursor:pointer;min-width:280px;transition:all .18s;position:relative}
.mbtn:hover{background:rgba(255,43,214,.16);box-shadow:0 0 22px rgba(255,43,214,.5);
  color:#fff;transform:translateX(0)}
.mbtn.alt{border-color:rgba(61,247,255,.4)}
.mbtn.alt:hover{background:rgba(61,247,255,.14);box-shadow:0 0 22px rgba(61,247,255,.5)}
#menu .foot{margin-top:34px;font-size:10px;letter-spacing:.24em;color:#5f5276}
#menu .best{margin-top:14px;font-size:12px;letter-spacing:.24em;color:var(--cyan)}
.hidden{display:none!important}
/* grade reveal */
#grade{font-family:var(--serif);font-size:150px;letter-spacing:.1em;
  color:var(--bone);text-shadow:0 0 40px var(--magenta),6px 0 0 var(--magenta),-6px 0 0 var(--cyan);
  animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{0%{transform:scale(3);opacity:0;filter:blur(14px)}
  60%{transform:scale(.92);opacity:1;filter:blur(0)}100%{transform:scale(1)}}
#endStats{margin-top:20px;font-size:14px;letter-spacing:.2em;line-height:2;color:var(--bone)}
#endStats .v{color:var(--cyan)}
#endStats .lv{color:var(--magenta)}
#endStats .lv2{color:var(--lime)}
#end{pointer-events:auto;cursor:pointer}
/* touch */
#touchLock{position:absolute;right:24px;bottom:84px;width:60px;height:60px;border-radius:50%;
  border:2px solid var(--cyan);color:var(--cyan);align-items:center;
  justify-content:center;font-size:11px;letter-spacing:.1em;z-index:35;pointer-events:auto;display:none;
  background:rgba(61,247,255,.08);box-shadow:0 0 18px rgba(61,247,255,.4)}
#touchLock.on{background:rgba(61,247,255,.3);color:#001}
@media (pointer:coarse){ #touchLock{display:flex} }
/* film / recording */
#rec{position:absolute;top:20px;right:24px;z-index:45;pointer-events:none;
  font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:#ff4d4d;
  display:none;align-items:center;gap:8px;text-shadow:0 0 8px rgba(255,0,0,.6)}
#rec .dot{width:10px;height:10px;border-radius:50%;background:#ff2b2b;
  box-shadow:0 0 10px #ff2b2b;animation:blink 1s steps(2) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
#filmNote{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);z-index:44;
  pointer-events:none;font-family:var(--mono);font-size:11px;letter-spacing:.24em;
  color:var(--cyan);text-shadow:0 0 8px rgba(61,247,255,.5)}
#dl{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:46;
  pointer-events:auto;font-family:var(--mono);font-size:13px;letter-spacing:.2em;
  color:#001;background:var(--lime);padding:12px 26px;text-decoration:none;
  box-shadow:0 0 22px rgba(182,255,59,.6)}
@media (max-width:600px){
  .hud{font-size:11px}
  #score b{font-size:18px}#combo b{font-size:20px}#sync b{font-size:16px}
  #sector .n{font-size:12px}#halo .shard{width:12px;height:18px}
  #menu .ttl{font-size:30px}
  .mbtn{min-width:230px;padding:10px 26px;font-size:12px}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <canvas id="fx"></canvas>
  <div class="ui">
    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hudFrame"><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div></div>
      <div id="score" class="hud">SCORE<br><b id="scoreV">0</b></div>
      <div id="halo"></div>
      <div id="sync" class="hud">SYNC<br><b id="syncV">100%</b></div>
      <div id="combo" class="hud">COMBO<br><b id="comboV">×1</b></div>
      <div id="sector" class="hud"><span class="t">SECTOR</span><br><span class="n" id="sectorV">I · RUST NAVE</span></div>
      <div id="power" class="hud"></div>
    </div>
    <!-- boot -->
    <div id="boot" class="center">
      <div class="pulse">CLICK / TAP TO ENTER THE VOID</div>
      <div class="sub">audio · procedural · no assets · 128bpm</div>
      <div style="margin-top:34px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center">
        <button class="mbtn alt" id="bootFilm">WATCH FILM ▸</button>
        <button class="mbtn alt" id="bootRec">● RECORD FILM</button>
      </div>
    </div>
    <!-- title / menu -->
    <div id="menu" class="center hidden">
      <div class="ttl" id="menuTtl">DESCENT</div>
      <div class="sub2" id="menuSub">a hymn for the last satellite</div>
      <div class="mrow" id="menuRow"></div>
      <div class="best" id="menuBest"></div>
      <div class="foot">DRAG / WASD move · HOLD FIRE · SHIFT lock-on · M mute · P pause · F full</div>
    </div>
    <!-- end -->
    <div id="end" class="center hidden">
      <div id="grade"></div>
      <div id="endStats"></div>
      <div style="margin-top:26px;font-size:12px;letter-spacing:.24em;color:var(--cyan)">TAP / SPACE TO RETRY</div>
    </div>
  </div>
  <button id="skip" class="hidden">skip ▸▸</button>
  <button id="mute">♪ ON</button>
  <div id="touchLock" class="hidden">LOCK</div>
  <div id="rec"><span class="dot"></span>REC</div>
  <div id="filmNote" class="hidden"></div>
  <a id="dl" class="hidden" download="neon-rust-requiem.webm">⬇ neon-rust-requiem.webm</a>
</div>

<script>
"use strict";
/* =====================================================================
   NEON RUST REQUIEM  —  single-file cinematic rhythm shooter (v4)
   Pokee-Isaac · procedural Canvas2D + WebAudio · no external assets
   ===================================================================== */

/* ---------- palette ---------- */
const PAL={void:'#07040d',violet:'#2a0f3d',magenta:'#ff2bd6',cyan:'#3df7ff',
  rust:'#c2551f',lime:'#b6ff3b',bone:'#f2e9f7'};
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgba(h,a){const c=hex(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`;}
function mix(a,b,t){const A=hex(a),B=hex(b);return`rgb(${A[0]+(B[0]-A[0])*t|0},${A[1]+(B[1]-A[1])*t|0},${A[2]+(B[2]-A[2])*t|0})`;}
function irid(t){t=((t%1)+1)%1;
  if(t<.5)return mix(PAL.magenta,PAL.cyan,t*2);
  return mix(PAL.cyan,PAL.violet,(t-.5)*2);}

/* ---------- constants ---------- */
const BPM=128, BEAT=60/BPM, BAR=BEAT*4, S16=BEAT/4;
const TAU=Math.PI*2;
const LYRICS=["we are the satellites","rust is just iron dreaming","delete me softly",
  "the choir is rotting","halo by halo","sing the void to sleep","chrome remembers",
  "angel of the last orbit","i am the requiem","orbit until you dissolve"];

/* ---------- math / easing ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const easeBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);}

/* ---------- canvas setup ---------- */
const cv=document.getElementById('game'), fx=document.getElementById('fx');
const ctx=cv.getContext('2d'), fctx=fx.getContext('2d');
let W=0,H=0,DPR=1,CX=0,CY=0;
const bloom=document.createElement('canvas'), bctx=bloom.getContext('2d');
const grain=document.createElement('canvas'), gctx=grain.getContext('2d');
function makeGrain(){const s=160;grain.width=grain.height=s;
  const id=gctx.createImageData(s,s);
  for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}
  gctx.putImageData(id,0,0);}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth;H=window.innerHeight;CX=W/2;CY=H/2;
  for(const c of [cv,fx]){c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';
    c.getContext('2d').setTransform(DPR,0,0,DPR,0,0);}
  bloom.width=Math.max(2,W>>1);bloom.height=Math.max(2,H>>1);
  makeGrain();
  buildCaches();
}
window.addEventListener('resize',resize);

/* =====================================================================
   AUDIO ENGINE
   ===================================================================== */
const AC={ctx:null,master:null,comp:null,shaper:null,analyser:null,
  bassData:null,highData:null,muted:false,started:false};
let noiseBuf=null, convolver=null, reverbSend=null;
const PHRY=[0,1,3,5,7,8,10];
const ROOT=45;
function noteHz(st){return 440*Math.pow(2,(st-69)/12);}
function buildAudio(){
  if(AC.started)return; AC.started=true;
  const C=new (window.AudioContext||window.webkitAudioContext)();
  AC.ctx=C;
  const master=C.createGain(); master.gain.value=AC.muted?0:.9;
  const comp=C.createDynamicsCompressor();
  comp.threshold.value=-18;comp.knee.value=24;comp.ratio.value=3;comp.attack.value=.004;comp.release.value=.2;
  const shaper=C.createWaveShaper();
  const curve=new Float32Array(1024);
  for(let i=0;i<1024;i++){const x=i/512-1;curve[i]=Math.tanh(x*2.2);}
  shaper.curve=curve;
  const analyser=C.createAnalyser();analyser.fftSize=1024;
  AC.bassData=new Uint8Array(analyser.frequencyBinCount);
  AC.highData=new Uint8Array(analyser.frequencyBinCount);
  master.connect(shaper);shaper.connect(comp);comp.connect(analyser);analyser.connect(C.destination);
  AC.master=master;AC.comp=comp;AC.shaper=shaper;AC.analyser=analyser;
  const nb=C.createBuffer(1,C.sampleRate*1.2,C.sampleRate);
  const nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  noiseBuf=nb;
  const len=C.sampleRate*2.4, ir=C.createBuffer(2,len,C.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);
    for(let i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}}
  convolver=C.createConvolver();convolver.buffer=ir;
  const rg=C.createGain();rg.gain.value=.55;
  convolver.connect(rg);rg.connect(master);
  reverbSend=convolver;
}
function env(g,t,a,d,peak,rel){
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
  if(rel)g.gain.exponentialRampToValueAtTime(0.0001,t+a+d+rel);
}
function sendReverb(node,amt){if(!AC.ctx)return;const g=AC.ctx.createGain();g.gain.value=amt;node.connect(g);g.connect(reverbSend);}
function kick(t,vel){if(!AC.ctx)return;const C=AC.ctx,o=C.createOscillator(),g=C.createGain();
  o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(44,t+.13);
  env(g,t,.002,.16,vel,.05);o.connect(g);g.connect(AC.master);sendReverb(g,.06);o.start(t);o.stop(t+.3);}
function snare(t,vel){if(!AC.ctx)return;const C=AC.ctx,s=C.createBufferSource();s.buffer=noiseBuf;
  const f=C.createBiquadFilter();f.type='bandpass';f.frequency.value=1900;f.Q.value=.8;
  const g=C.createGain();env(g,t,.001,.14,vel,.02);
  s.connect(f);f.connect(g);g.connect(AC.master);sendReverb(g,.25);s.start(t);s.stop(t+.2);
  const o=C.createOscillator(),og=C.createGain();o.type='triangle';
  o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(90,t+.1);
  env(og,t,.001,.09,vel*.5);o.connect(og);og.connect(AC.master);o.start(t);o.stop(t+.12);}
function hat(t,vel,open){if(!AC.ctx)return;const C=AC.ctx,s=C.createBufferSource();s.buffer=noiseBuf;
  const f=C.createBiquadFilter();f.type='highpass';f.frequency.value=7500;
  const g=C.createGain();env(g,t,.001,open?.12:.03,vel);
  s.connect(f);f.connect(g);g.connect(AC.master);s.start(t);s.stop(t+(open?.2:.06));}
function pad(t,dur,deg,vel){if(!AC.ctx)return;const C=AC.ctx;const base=noteHz(ROOT+deg);
  const lp=C.createBiquadFilter();lp.type='lowpass';lp.Q.value=6;
  lp.frequency.setValueAtTime(300,t);lp.frequency.linearRampToValueAtTime(2600,t+dur*.5);
  lp.frequency.linearRampToValueAtTime(500,t+dur);
  const g=C.createGain();g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vel,t+dur*.4);g.gain.linearRampToValueAtTime(0.0001,t+dur);
  lp.connect(g);g.connect(AC.master);sendReverb(g,.5);
  for(const det of [-8,8,-4,4]){const o=C.createOscillator();o.type='sawtooth';
    o.frequency.value=base;o.detune.value=det;o.connect(lp);o.start(t);o.stop(t+dur+.1);}}
function arp(t,deg,vel){if(!AC.ctx)return;const C=AC.ctx,f=noteHz(60+deg);
  const o1=C.createOscillator(),o2=C.createOscillator(),g=C.createGain();
  o1.type='square';o2.type='square';o1.frequency.value=f;o2.frequency.value=f;o2.detune.value=14;
  const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3800;
  env(g,t,.004,.16,vel,.05);
  o1.connect(lp);o2.connect(lp);lp.connect(g);g.connect(AC.master);sendReverb(g,.35);
  o1.start(t);o2.start(t);o1.stop(t+.3);o2.stop(t+.3);}
function choir(t,dur,deg,vel){if(!AC.ctx)return;const C=AC.ctx,base=noteHz(48+deg);
  const g=C.createGain();g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vel,t+dur*.5);g.gain.linearRampToValueAtTime(0.0001,t+dur);
  const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1600;
  lp.connect(g);g.connect(AC.master);sendReverb(g,.9);
  const parts=[1,1.005,.995,1.01];
  for(const r of parts){const o=C.createOscillator();o.type='sine';o.frequency.value=base*r;
    const vib=C.createOscillator(),vg=C.createGain();
    vib.frequency.value=5.2;vg.gain.value=3;vib.connect(vg);vg.connect(o.frequency);
    o.connect(lp);o.start(t);o.stop(t+dur+.1);vib.start(t);vib.stop(t+dur+.1);}}
function sfxHit(harm){if(!AC.ctx)return;const C=AC.ctx,t=C.currentTime;
  const o=C.createOscillator(),g=C.createGain();
  o.type='triangle';o.frequency.setValueAtTime(harm?900:500,t);
  o.frequency.exponentialRampToValueAtTime(harm?1400:260,t+.06);
  env(g,t,.001,.06,harm?.35:.18);o.connect(g);g.connect(AC.master);o.start(t);o.stop(t+.1);}
function sfxShard(){if(!AC.ctx)return;const C=AC.ctx,t=C.currentTime,s=C.createBufferSource();s.buffer=noiseBuf;
  const f=C.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=2;
  const g=C.createGain();env(g,t,.001,.08,.22);
  s.connect(f);f.connect(g);g.connect(AC.master);s.start(t);s.stop(t+.12);}
function sfxExplosion(){if(!AC.ctx)return;const C=AC.ctx,t=C.currentTime,s=C.createBufferSource();s.buffer=noiseBuf;
  const f=C.createBiquadFilter();f.type='lowpass';
  f.frequency.setValueAtTime(2400,t);f.frequency.exponentialRampToValueAtTime(200,t+.4);
  const g=C.createGain();env(g,t,.005,.4,.5,.1);
  s.connect(f);f.connect(g);g.connect(AC.master);sendReverb(g,.3);s.start(t);s.stop(t+.6);}
function sfxPower(){if(!AC.ctx)return;const C=AC.ctx,t=C.currentTime;
  [0,4,7,12].forEach((d,i)=>{const o=C.createOscillator(),g=C.createGain();
    o.type='sine';o.frequency.value=noteHz(69+d);
    env(g,t+i*.05,.005,.14,.3);o.connect(g);g.connect(AC.master);o.start(t+i*.05);o.stop(t+i*.05+.2);});}
function sfxStrobe(){if(!AC.ctx)return;const C=AC.ctx,t=C.currentTime;
  const o=C.createOscillator(),g=C.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(1200,t);o.frequency.exponentialRampToValueAtTime(80,t+.3);
  env(g,t,.002,.3,.3);o.connect(g);g.connect(AC.master);sendReverb(g,.4);o.start(t);o.stop(t+.4);}

/* ---------- scheduler ---------- */
const SCHED={step:0,nextTime:0,lookahead:.12,timer:null};
let musicMode='intro';
function startMusic(){if(!AC.started)return;
  SCHED.step=0;SCHED.nextTime=AC.ctx.currentTime+.08;
  if(SCHED.timer)clearInterval(SCHED.timer);
  SCHED.timer=setInterval(scheduleTick,25);}
function stopMusic(){if(SCHED.timer){clearInterval(SCHED.timer);SCHED.timer=null;}}
function scheduleTick(){if(!AC.ctx)return;const C=AC.ctx;
  while(SCHED.nextTime<C.currentTime+SCHED.lookahead){
    const s=SCHED.step,t=SCHED.nextTime;
    if(musicMode==='intro')scheduleIntro(s,t);else scheduleGame(s,t);
    SCHED.nextTime+=S16;SCHED.step++;}}
function scheduleIntro(s,t){
  const bar=Math.floor(s/16), beatInBar=Math.floor((s%16)/4);
  const prog=[0,1,3,5];const deg=prog[bar%prog.length];
  if(bar<2){if(beatInBar===0||beatInBar===2)kick(t,1.0);}
  else if(beatInBar===0)kick(t,1.0);
  if(bar>=2&&(beatInBar===1||beatInBar===3))snare(t,.8);
  if(bar>=1){if(s%2===0)hat(t,.25,false);}
  if(s%16===0)pad(t,BAR,deg,.16+Math.min(.1,bar*.02));
  if(bar>=4&&s%2===0)arp(t,PHRY[(s/2|0)%PHRY.length]+12,.16);
  if(bar>=6&&s%16===0)choir(t,BAR,deg,.22);
}
function scheduleGame(s,t){
  const bar=Math.floor(s/16), beatInBar=Math.floor((s%16)/4);
  const sec=game.sector;const prog=[0,1,3,5,4,1,0,1];const deg=prog[bar%prog.length];
  kick(t,1.0);
  if(beatInBar===1||beatInBar===3)snare(t,.85);
  hat(t,.22,s%2===1&&sec>=1);
  if(sec>=2&&s%2===1)hat(t,.15,true);
  if(s%16===0)pad(t,BAR,deg,.14);
  if(bar%2===1&&s%16===0)choir(t,BAR,deg,.18);
  const dens=1+sec;
  if(s%dens===0)arp(t,PHRY[(s/dens|0)%PHRY.length]+12,.14+sec*.02);
}
let lastScale=0;
function playScaleNote(){if(!AC.ctx)return;const C=AC.ctx,t=C.currentTime;
  const seq=[0,3,5,7,10,12,15,17];const d=seq[lastScale%seq.length];lastScale++;
  const o=C.createOscillator(),g=C.createGain();o.type='triangle';
  o.frequency.value=noteHz(69+d);env(g,t,.005,.22,.4,.1);
  o.connect(g);g.connect(AC.master);sendReverb(g,.4);o.start(t);o.stop(t+.35);}
function getLevels(){if(!AC.analyser)return{bass:0,high:0};
  AC.analyser.getByteFrequencyData(AC.bassData);
  let b=0;for(let i=1;i<8;i++)b+=AC.bassData[i];b/=7*255;
  let h=0;for(let i=40;i<90;i++)h+=AC.highData?AC.highData[i]:AC.bassData[i];h/=50*255;
  return{bass:b,high:h};}

const GLYPHS=[];
function buildGlyphs(){
  const n=16;
  for(let i=0;i<n;i++){
    const c=document.createElement('canvas');c.width=c.height=64;
    const g=c.getContext('2d');g.strokeStyle='#fff';g.lineWidth=2;g.lineCap='round';
    const seed=i*13.7;
    const steps=ri(3,7);
    let x=16,y=16;g.beginPath();g.moveTo(x,y);
    for(let s=0;s<steps;s++){
      const a=hash(seed+s)*TAU;const len=6+hash(seed+s+9)*16;
      x=clamp(x+Math.cos(a)*len,6,58);y=clamp(y+Math.sin(a)*len,6,58);
      g.lineTo(x,y);
      if(hash(seed+s+3)>.5){x+=rand(-6,6);g.lineTo(x,y);}
    }
    if(hash(seed+5)>.5){g.beginPath();g.arc(32,32,8+hash(seed)*8,0,TAU);g.stroke();}
    if(hash(seed+7)>.4){g.beginPath();g.moveTo(8,32);g.lineTo(56,32);g.stroke();}
    GLYPHS.push(c);
  }
}
buildGlyphs();
function drawGlyph(x,y,s,rot,col,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=a;
  ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.lineCap='round';
  ctx.drawImage(GLYPHS[ri(0,GLYPHS.length-1)],-s/2,-s/2,s,s);
  ctx.restore();ctx.globalAlpha=1;
}

/* ---------- cached feathers / wings / boss face ---------- */
const cache={front:null,back:null,boss:null,bossW:null,bossH:null};
function buildCaches(){
  cache.front=makeWing(12,35,1.0);
  cache.back=makeWing(16,52,0.55);
  const S=Math.min(W,H)*.3;
  cache.bossW=Math.ceil(S*1.4);cache.bossH=Math.ceil(S*1.6);
  const bc=document.createElement('canvas');bc.width=cache.bossW;bc.height=cache.bossH;
  const g=bc.getContext('2d');g.translate(cache.bossW/2,cache.bossH/2);
  g.globalCompositeOperation='lighter';
  g.strokeStyle=rgba(PAL.magenta,.6);g.lineWidth=3;
  g.beginPath();
  g.moveTo(-S*.6,S*.6);g.lineTo(-S*.6,-S*.2);
  g.quadraticCurveTo(-S*.6,-S*.7,0,-S*.8);
  g.quadraticCurveTo(S*.6,-S*.7,S*.6,-S*.2);
  g.lineTo(S*.6,S*.6);g.stroke();
  g.strokeStyle=rgba(PAL.bone,.5);g.lineWidth=2;
  g.beginPath();
  g.moveTo(-S*.3,-S*.1);g.lineTo(-S*.15,-S*.1);
  g.moveTo(S*.15,-S*.1);g.lineTo(S*.3,-S*.1);
  g.moveTo(-S*.2,S*.3);g.quadraticCurveTo(0,S*.4,S*.2,S*.3);
  g.stroke();
  g.fillStyle=rgba(PAL.magenta,.8);
  g.beginPath();g.arc(-S*.22,-S*.1,6,0,TAU);g.fill();
  g.beginPath();g.arc(S*.22,-S*.1,6,0,TAU);g.fill();
  cache.boss=bc;
}
function makeWing(count,len,op){
  const c=document.createElement('canvas');
  const w=Math.ceil(len*1.4+10),h=Math.ceil(len*1.4+10);
  c.width=w;c.height=h;
  const g=c.getContext('2d');g.translate(5,5);g.globalCompositeOperation='lighter';
  for(let i=0;i<count;i++){
    const f=i/count;
    const a=.3+f*1.2;
    const L=len*(1-f*.3);
    const wg=g.createLinearGradient(0,0,Math.cos(a)*L,Math.sin(a)*L);
    wg.addColorStop(0,rgba(curSector().accent,.6*op));
    wg.addColorStop(1,rgba(PAL.bone,.2*op));
    g.strokeStyle=wg;g.lineWidth=1.5;
    g.beginPath();g.moveTo(0,0);
    g.quadraticCurveTo(Math.cos(a)*L*.5,Math.sin(a)*L*.5-4,Math.cos(a)*L,Math.sin(a)*L);
    g.stroke();
  }
  return c;
}
function refreshWingCache(){cache.front=makeWing(12,35,1.0);cache.back=makeWing(16,52,0.55);}

/* ---------- text-pixel target sampler (ending) ---------- */
function sampleTextTargets(text,count){
  const c=document.createElement('canvas');
  const fs=Math.min(90,W*.1);
  c.width=W;c.height=140;
  const g=c.getContext('2d');
  g.font='bold '+fs+'px Georgia,serif';g.textAlign='center';g.textBaseline='middle';
  g.fillStyle='#fff';g.fillText(text,W/2,70);
  const d=g.getImageData(0,0,W,140).data;
  const pts=[];
  for(let y=0;y<140;y+=2)for(let x=0;x<W;x+=2){
    if(d[(y*W+x)*4+3]>128)pts.push({x,y:y-70});
  }
  const out=[];
  for(let i=0;i<count;i++){
    const p=pts.length?pts[(Math.random()*pts.length)|0]:{x:rand(0,W),y:0};
    out.push({x:p.x,y:CY+H*.25+p.y});
  }
  return out;
}

/* =====================================================================
   FILM MODE — autopilot + director + recording
   ===================================================================== */
const film={t:0,phase:'intro',chapter:0,chapterT:0,credits:false,
  lockT:0,lockCd:0,aimT:0,aimX:0,aimY:0,slow:0,
  rec:null,chunks:[],url:null,done:false};
function recSupported(){
  return !!(typeof MediaRecorder!=='undefined' && cv.captureStream &&
    (window.AudioContext||window.webkitAudioContext) &&
    (AC.ctx ? !!AC.ctx.createMediaStreamDestination : !!(window.AudioContext||window.webkitAudioContext).prototype.createMediaStreamDestination));
}
function startFilm(record){
  filmMode=true;
  film.t=0;film.phase='intro';film.chapter=0;film.chapterT=0;film.credits=false;
  film.lockT=0;film.lockCd=0;film.aimT=0;film.slow=0;
  film.rec=null;film.chunks=[];film.url=null;film.done=false;
  // audio must exist before recording
  buildAudio();
  if(AC.ctx&&AC.ctx.state==='suspended')AC.ctx.resume();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
  document.getElementById('boot').classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('touchLock').classList.add('hidden');
  document.getElementById('skip').classList.add('hidden');
  filmLetterbox=true;
  const note=document.getElementById('filmNote');
  if(record){
    try{
      const dest=AC.ctx.createMediaStreamDestination();
      AC.master.connect(dest);
      const vs=cv.captureStream(60);
      const combined=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);
      const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus'
        :MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')?'video/webm;codecs=vp8,opus':'video/webm';
      film.rec=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond:8e6});
      film.rec.ondataavailable=e=>{if(e.data&&e.data.size)film.chunks.push(e.data);};
      film.rec.onstop=()=>{
        const blob=new Blob(film.chunks,{type:'video/webm'});
        film.url=URL.createObjectURL(blob);
        const dl=document.getElementById('dl');
        dl.href=film.url;dl.classList.remove('hidden');
      };
      film.rec.start(250);
      document.getElementById('rec').style.display='flex';
    }catch(err){document.getElementById('rec').style.display='none';}
  }
  note.textContent=record?'● RECORDING FILM — hands-free':'FILM — hands-free · ESC to exit';
  note.classList.remove('hidden');
  // go to intro directly (no enter() so skip button stays hidden)
  state=ST.INTRO;introT=0;musicMode='intro';startMusic();
}
function exitFilm(){
  stopRecording();
  filmMode=false;
  document.getElementById('filmNote').classList.add('hidden');
  document.getElementById('rec').style.display='none';
  // keep partial download available if any
  if(!film.url)document.getElementById('dl').classList.add('hidden');
  onTitle();
}
function filmDirector(dt){
  film.t+=dt;
  if(film.phase==='intro'){
    if(introT>56){
      resetGame();state=ST.GAME;setSector(0);musicMode='game';startMusic();
      film.phase='game';film.chapter=0;film.chapterT=0;
    }
    return;
  }
  // chapter card — shown once at start of each chapter (no reset)
  film.chapterT+=dt;
  // autopilot
  const pl=game.player;
  const weave=W*.22*Math.sin(film.t*.5)+W*.1*Math.sin(film.t*1.3);
  const weaveY=H*.12*Math.sin(film.t*.7+1);
  pl.tx=clamp(weave,-W*.36,W*.36);
  pl.ty=clamp(weaveY,-H*.3,H*.3);
  // aim at nearest threat
  film.aimT-=dt;
  if(film.aimT<=0){
    film.aimT=.12;
    let best=null,bd=1e9;
    for(const e of game.enemies){if(e.dead)continue;
      const d=Math.hypot(e.x-pl.x,e.y-pl.y);if(d<bd){bd=d;best=e;}}
    if(game.boss&&!game.boss.dead){
      const d=Math.hypot(game.boss.x-pl.x,game.boss.y-pl.y);
      if(d<bd*1.4){best=game.boss;}
    }
    if(best){film.aimX=CX+best.x;film.aimY=CY+best.y;}
    else{film.aimX=CX+pl.x;film.aimY=CY+pl.y-H*.3;}
  }
  pointer.x=film.aimX;pointer.y=film.aimY;
  // fire on beat
  const bp=(game.time%BEAT)/BEAT;
  pl.firing=bp<0.35||bp>0.7;
  // periodic lock-on
  film.lockCd-=dt;
  if(film.lockCd<=0){
    const cands=game.enemies.filter(e=>!e.dead);
    if(cands.length>=2){
      pl.lock=true;film.lockT=0;
      film.lockCd=3+rand(0,2);
    }
  }
  if(pl.lock){film.lockT+=dt;if(film.lockT>0.35)releaseLock();}
  // cinematic slow-mo on big kills
  if(slowmo>0){slowmo-=dt;timeScale=lerp(timeScale,.5,dt*6);}
  // phase transitions
  if(film.phase==='game'){
    if(game.bossActive&&game.boss&&game.boss.hp<=0){
      if(game.sector<2){
        setSector(game.sector+1);film.chapter=game.sector;film.chapterT=0;
      } else {
        film.phase='ending';film.credits=false;
        winGame();
      }
    }
  }
  if(film.phase==='ending'){
    if(endT>6&&!film.credits){
      film.credits=true;
      stopRecording();
    }
    if(endT>12&&!film.done){
      film.done=true;
      // show download + return
      const dl=document.getElementById('dl');
      if(film.url){dl.href=film.url;dl.classList.remove('hidden');}
      const end=document.getElementById('end');
      const ret=document.createElement('button');
      ret.className='mbtn alt';ret.textContent='RETURN ▸';
      ret.style.marginTop='20px';
      ret.onclick=(e)=>{e.stopPropagation();exitFilm();};
      end.appendChild(ret);
    }
  }
}

const INTRO_TOTAL=60;
function introScene(t){
  const scenes=[[0,8],[8,20],[20,32],[32,46],[46,56],[56,INTRO_TOTAL+999]];
  for(let i=0;i<scenes.length;i++){
    if(t>=scenes[i][0]&&t<scenes[i][1]){
      const local=(t-scenes[i][0])/(scenes[i][1]-scenes[i][0]);
      return{i,local,t};
    }
  }
  return{i:5,local:1,t};
}
function renderIntro(t){
  const s=introScene(t);
  ctx.fillStyle=PAL.void;ctx.fillRect(0,0,W,H);
  const lb=H*0.11;
  if(s.i===0){
    const a=easeOut(clamp(s.local*3,0,1));
    drawStatic(a*.5);
    const hb=Math.pow(Math.max(0,1-(t%BEAT)/BEAT),2);

/* =====================================================================
   GAME RENDER + UPDATE
   ===================================================================== */
function updateGame(dt){
  game.time+=dt;
  game.sectorT+=dt;
  const sec=curSector();
  const beatPos=(game.time%BEAT)/BEAT;
  beatPulse=Math.pow(Math.max(0,1-beatPos),2);
  if(Math.floor(game.time/BEAT)!==lastBeat){lastBeat=Math.floor(game.time/BEAT);beatFlash=1;}
  beatFlash=Math.max(0,beatFlash-dt*4);
  const lv=getLevels();audioBass=lv.bass;audioHigh=lv.high;
  if(game.power.over>0){game.power.over-=dt;timeScale=lerp(timeScale,.55,dt*6);}
  else timeScale=lerp(timeScale,1,dt*4);
  const sdt=dt*timeScale;
  const pl=game.player;
  const spd=900;
  if(!filmMode){
    if(keys['a']||keys['arrowleft'])pl.tx-=spd*dt;
    if(keys['d']||keys['arrowright'])pl.tx+=spd*dt;
    if(keys['w']||keys['arrowup'])pl.ty-=spd*dt;
    if(keys['s']||keys['arrowdown'])pl.ty+=spd*dt;
  }
  pl.tx=clamp(pl.tx,-W*.36,W*.36);pl.ty=clamp(pl.ty,-H*.3,H*.3);
  pl.px=pl.x;pl.py=pl.y;
  pl.x=lerp(pl.x,pl.tx,dt*8);pl.y=lerp(pl.y,pl.ty,dt*8);
  pl.bank=clamp((pl.x-pl.px)*.05,-.5,.5);
  pl.fireCd-=sdt;
  if(pl.firing&&pl.fireCd<=0){pl.fireCd=S16*.9;fire();}
  if(pl.lock){pl.lockT+=sdt;if(pl.lockT>0.12){pl.lockT=0;refreshLock();}}
  if(game.power.choir>0)game.power.choir-=dt;
  game.ringT-=sdt;
  if(game.ringT<=0){game.ringT=BAR/2;spawnRing();}
  updateRings(sdt);
  spawnLogic(sdt);
  if(game.sectorT>=sectorDur()&&!game.bossActive)startBoss();
  if(game.boss)updateBoss(sdt);
  updateBullets(sdt);
  updateEBullets(sdt);
  updateEnemies(sdt);
  updateParticles(sdt);
  updateShards(sdt);
  if(game.combo>0){game.comboDecay=(game.comboDecay||0)+sdt;
    if(game.comboDecay>1.2){game.combo=0;game.comboDecay=0;}}
  if(game.iframes>0)game.iframes-=dt;
  if(game.sectorT>=sectorDur()&&game.bossActive&&game.boss&&game.boss.hp<=0){
    if(game.sector<2){setSector(game.sector+1);}
    else winGame();
  }
  updateHUD();
}
function fire(){
  const pl=game.player;
  const px=CX+pl.x,py=CY+pl.y;
  const beatPos=(game.time%BEAT)/BEAT;
  const off=Math.min(beatPos,1-beatPos)*BEAT;
  const harm=off<=0.09;
  game.shots++;if(harm)game.harm++;
  const col=harm?curSector().accent:PAL.bone;
  const n=game.power.choir>0?3:1;
  const ax=pointer.x-px, ay=pointer.y-py;
  const alen=Math.hypot(ax,ay)||1;
  const baseAng=Math.atan2(ay,ax);
  for(let i=0;i<n;i++){
    const ang=baseAng+(i-(n-1)/2)*.12;
    game.bullets.push({x:px,y:py,vx:Math.cos(ang)*900,vy:Math.sin(ang)*900,
      harm,col,size:harm?7:4,life:1.4});
  }
  if(harm){playScaleNote();sfxHit(true);game.combo++;game.maxCombo=Math.max(game.maxCombo,game.combo);
    game.sync=clamp(game.sync+1.5,0,100);
    if(game.combo%10===0)addShake(3);
    spawnParticle({x:px,y:py,vx:0,vy:0,size:20,color:col,shape:'ring',life:0,max:.4,drag:1});
    spawnParticle({x:px,y:py-20,vx:0,vy:-40,size:16,color:PAL.bone,shape:'glyph',life:0,max:.5,drag:1});
  } else {sfxHit(false);game.sync=clamp(game.sync-.5,0,100);
    if(game.combo>0)game.combo=0;}
  spawnParticle({x:px,y:py,vx:0,vy:-200,size:harm?10:5,color:col,shape:'spark',life:0,max:.15,drag:.9});
}
function refreshLock(){
  const pl=game.player;
  const cands=game.enemies.filter(e=>!e.dead&&e.locked!==true);
  cands.sort((a,b)=>(a.z||0)-(b.z||0));
  const want=8;
  game.lockTargets.length=0;
  for(const e of cands){if(game.lockTargets.length>=want)break;
    game.lockTargets.push(e);e.locked=true;}
  if(game.lockTargets.length){
    const t=game.lockTargets.length;
    game.lockFire=0;
    const seq=[0,3,5,7,10,12,15,17];
    const startStep=SCHED.step;
    game.lockQueue=game.lockTargets.slice(0,t).map((e,i)=>({e,step:startStep+i,note:seq[i%seq.length]}));
  }
}
function releaseLock(){
  const pl=game.player;
  if(pl.lock&&game.lockQueue&&game.lockQueue.length){
    let i=0;
    for(const q of game.lockQueue){
      const px=CX+pl.x,py=CY+pl.y;
      game.bullets.push({x:px,y:py,vx:0,vy:-900,harm:true,col:curSector().accent,
        size:6,life:2,homing:true,target:q.e,note:q.note});
      if(AC.ctx){const C=AC.ctx,t=C.currentTime+i*.06;
        const o=C.createOscillator(),g=C.createGain();o.type='triangle';
        o.frequency.value=noteHz(69+q.note);env(g,t,.005,.18,.35,.1);o.connect(g);g.connect(AC.master);sendReverb(g,.4);o.start(t);o.stop(t+.3);}
      i++;
    }
  }
  pl.lock=false;pl.lockT=0;game.lockQueue=null;
  for(const e of game.lockTargets)e.locked=false;
  game.lockTargets.length=0;
}
function spawnRing(){
  const sec=curSector();
  const col=Math.random()<.5?sec.a:sec.accent;
  game.rings.push({z:1.0,col,beat:0,glow:0});
}
function updateRings(dt){
  const speed=(1.0/(BAR*1.5));
  for(const r of game.rings){r.z-=dt*speed*1.6;if(r.z<0.02)r.z=0.02;}
  game.rings=game.rings.filter(r=>r.z>0.02);
}

  const sec=curSector();
  game.spawnT=(game.spawnT||0)-dt;
  if(game.sectorT<BAR*8)return;
  const ramp=clamp((game.sectorT-BAR*8)/(sectorDur()-BAR*8),0,1);
  const interval=lerp(3.5,lerp(2.2,0.9,game.sector/2),ramp)*(game.bossActive?1.6:1);
  if(game.spawnT<=0&&!game.bossActive){
    game.spawnT=interval*rand(.7,1.3);
    spawnEnemy();
  }
}
function spawnEnemy(){
  const sec=game.sector;
  const avail=sec===0?['moth','moth','seraph']:sec===1?['moth','seraph','hulk','wraith']:['seraph','hulk','wraith','wraith'];
  const type=avail[ri(0,avail.length-1)];
  const e={type,z:1.0,x:rand(-W*.3,W*.3),y:rand(-H*.22,H*.22),
    hp:type==='hulk'?8:type==='seraph'?6:type==='wraith'?4:3,
    maxhp:type==='hulk'?8:type==='seraph'?6:type==='wraith'?4:3,
    t:rand(0,10),phase:rand(0,TAU),dead:false,locked:false,
    shield:type==='seraph'?true:false,fragments:0,
    color:type==='moth'?PAL.rust:type==='seraph'?PAL.cyan:type==='hulk'?PAL.violet:PAL.magenta};
  game.enemies.push(e);
}
function updateEnemies(dt){
  for(const e of game.enemies){
    if(e.dead)continue;
    e.t+=dt;
    e.z-=dt*(0.06+game.sector*0.02);
    if(e.z<=0.05){e.dead=true;if(!filmMode)damagePlayer(1);continue;}
    if(e.type==='moth'){e.x+=Math.sin(e.t*2+e.phase)*80*dt;e.y+=Math.cos(e.t*1.5+e.phase)*60*dt;}
    else if(e.type==='wraith'){
      e.wt=(e.wt||0)-dt;
      if(e.wt<=0){e.wt=1.5;e.x=rand(-W*.3,W*.3);e.y=rand(-H*.22,H*.22);
        for(let i=0;i<6;i++)spawnParticle({x:CX+e.x,y:CY+e.y,vx:rand(-3,3),vy:rand(-3,3),
          size:4,color:PAL.magenta,shape:'shard',life:0,max:.4,drag:.9,datamosh:true});}
    }
    else if(e.type==='hulk'){e.y+=Math.sin(e.t)*20*dt;}
    if(e.fireCd===undefined)e.fireCd=rand(0,1);
    if(game.sectorT>BAR*8){
      e.fireCd-=dt;
      if(e.fireCd<=0&&e.z<0.9&&e.z>0.2){
        e.fireCd=lerp(2.5,0.9,game.sector/2)*rand(.8,1.2);
        enemyFire(e);
      }
    }
  }
  game.enemies=game.enemies.filter(e=>!e.dead||e.fragments>0);
}
function enemyFire(e){
  const px=CX+e.x,py=CY+e.y;
  const sec=curSector();
  const col=sec.a;
  const spd=lerp(180,320,game.sector/2);
  if(e.type==='wraith'){
    const n=8+game.sector*2;
    for(let i=0;i<n;i++){const a=i/n*TAU+e.phase;
      game.ebullets.push({x:px,y:py,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,size:6,col,life:3});}
  } else if(e.type==='seraph'){
    const n=5;
    for(let i=0;i<n;i++){const a=e.phase+i*.4;
      game.ebullets.push({x:px,y:py,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,size:5,col,life:3});}
  } else {
    const tx=CX+game.player.x,ty=CY+game.player.y;
    const a=Math.atan2(ty-py,tx-px);
    game.ebullets.push({x:px,y:py,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,size:7,col,life:3});
  }
}
function updateBullets(dt){
  for(const b of game.bullets){
    if(b.homing&&b.target&&!b.target.dead){
      const tx=CX+b.target.x,ty=CY+b.target.y;
      const a=Math.atan2(ty-b.y,tx-b.x);
      b.vx=lerp(b.vx,Math.cos(a)*1100,dt*4);
      b.vy=lerp(b.vy,Math.sin(a)*1100,dt*4);
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    for(const e of game.enemies){
      if(e.dead)continue;
      const ex=CX+e.x,ey=CY+e.y;
      const d=Math.hypot(b.x-ex,b.y-ey);
      if(d<34){hitEnemy(e,b);b.life=0;break;}
    }
    if(game.boss&&!game.boss.dead){
      const bx=CX+game.boss.x,by=CY+game.boss.y;
      if(Math.hypot(b.x-bx,b.y-by)<90){hitBoss(b);b.life=0;}
    }
  }
  game.bullets=game.bullets.filter(b=>b.life>0&&b.y>-50&&b.y<H+50&&b.x>-50&&b.x<W+50);
}
function hitEnemy(e,b){
  if(e.shield){
    const beatPos=(game.time%BEAT)/BEAT;
    const off=Math.min(beatPos,1-beatPos)*BEAT;
    if(off>0.09){sfxShard();spawnShard(CX+e.x,CY+e.y,PAL.cyan,4);return;}
  }
  const dmg=b.harm?2:1;
  e.hp-=dmg;
  spawnRust(CX+e.x,CY+e.y,b.harm?10:5);
  sfxHit(b.harm);
  if(b.harm){game.score+=100*comboMult();addShake(2);}
  else game.score+=40*comboMult();
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  e.dead=true;
  spawnShard(CX+e.x,CY+e.y,e.color,14);
  spawnRust(CX+e.x,CY+e.y,10);
  sfxExplosion();
  game.score+=300*comboMult();
  addShake(5);hitstop=Math.max(hitstop,.05);
  if(Math.random()<0.12){
    const p=['tear','choir','over'][ri(0,2)];
    game.shards.push({x:e.x,y:e.y,type:p,z:e.z,t:0});
  }
  if(e.type==='hulk'&&e.fragments<1){
    e.fragments=1;
    for(let i=0;i<3;i++){
      game.enemies.push({type:'moth',z:e.z,x:e.x+rand(-40,40),y:e.y+rand(-40,40),
        hp:2,maxhp:2,t:rand(0,10),phase:rand(0,TAU),dead:false,locked:false,
        shield:false,fragments:1,color:PAL.rust,fireCd:rand(0,1)});
    }
  }
}
function comboMult(){return 1+Math.min(game.combo,50)*0.05;}
function damagePlayer(n){
  if(filmMode){
    // invulnerable — deflect with shield ripple
    spawnParticle({x:CX+game.player.x,y:CY+game.player.y,vx:0,vy:0,size:30,
      color:PAL.cyan,shape:'ring',life:0,max:.5,drag:1});
    sfxShard();
    return;
  }
  if(game.iframes>0)return;
  game.hp-=n;game.iframes=1.5;
  game.sync=clamp(game.sync-8,0,100);
  if(game.combo>0)game.combo=0;
  addShake(10);flash=Math.max(flash,.4);
  sfxExplosion();
  spawnShard(CX+game.player.x,CY+game.player.y,PAL.magenta,12);
  updateHalo();
  if(game.hp<=0)loseGame();
}
/* ---------- BOSS ---------- */
function startBoss(){
  game.bossActive=true;state=ST.BOSS;
  const hpMul=filmMode?0.35:1;
  game.boss={x:0,y:-H*.15,hp:(60+game.sector*40)*hpMul,maxhp:(60+game.sector*40)*hpMul,
    t:0,phase:0,pipes:[],weak:[],fireT:0,dead:false};
  const b=game.boss;
  for(let i=0;i<8;i++)b.pipes.push({a:i/8*TAU,r:130,len:60});
  for(let i=0;i<4;i++)b.weak.push({a:i/4*TAU+0.4,r:70,hp:20*hpMul,maxhp:20*hpMul,flash:0});
  sfxStrobe();
  if(!filmMode){
    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('touchLock').classList.remove('hidden');
  }
}
function updateBoss(dt){
  const b=game.boss;if(!b||b.dead)return;
  b.t+=dt;
  b.phase=b.hp>b.maxhp*.66?0:b.hp>b.maxhp*.33?1:2;
  for(const w of b.weak){w.a+=dt*.3;w.flash=Math.max(0,w.flash-dt*3);}
  for(const p of b.pipes)p.a+=dt*(.4+b.phase*.2);
  b.fireT-=dt;
  if(b.fireT<=0){b.fireT=lerp(1.2,0.5,b.phase/2);bossFire(b);}
  if(b.hp<=0){
    b.dead=true;
    sfxExplosion();sfxStrobe();
    for(let i=0;i<60;i++)spawnShard(CX+b.x,CY+b.y,irid(i/60),1);
    spawnRust(CX+b.x,CY+b.y,40);
    game.score+=5000*comboMult();
    addShake(20);hitstop=.2;
    game.boss=null;
  }
}
function bossFire(b){
  const sec=curSector();
  const col=sec.accent;
  const px=CX+b.x,py=CY+b.y;
  if(b.phase===0){
    const n=16;for(let i=0;i<n;i++){const a=i/n*TAU+b.t;
      game.ebullets.push({x:px,y:py,vx:Math.cos(a)*280,vy:Math.sin(a)*280,size:7,col,life:3.5});}
  } else if(b.phase===1){
    const n=24;for(let i=0;i<n;i++){const a=i/n*TAU+b.t*2;
      game.ebullets.push({x:px,y:py,vx:Math.cos(a)*320,vy:Math.sin(a)*320,size:6,col,life:3.5});}
  } else {
    for(let i=0;i<6;i++){const a=b.t*3+i*1.05;
      game.ebullets.push({x:px,y:py,vx:Math.cos(a)*340,vy:Math.sin(a)*340,size:6,col,life:3.5});}
  }
}
function hitBoss(b){
  const bo=game.boss;if(!bo||bo.dead)return;
  let hit=false;
  for(const w of bo.weak){
    const wx=CX+bo.x+Math.cos(w.a)*w.r,wy=CY+bo.y+Math.sin(w.a)*w.r;
    if(Math.hypot(b.x-wx,b.y-wy)<30){
      w.hp-=b.harm?2:1;w.flash=1;
      spawnShard(wx,wy,PAL.lime,6);sfxHit(true);
      game.score+=150*comboMult();hit=true;
      if(w.hp<=0){w.hp=0;spawnShard(wx,wy,PAL.lime,14);sfxExplosion();}
      break;
    }
  }
  if(!hit){
    const beatPos=(game.time%BEAT)/BEAT;
    const off=Math.min(beatPos,1-beatPos)*BEAT;
    if(off<=0.09){bo.hp-=b.harm?2:1;spawnRust(b.x,b.y,4);game.score+=60*comboMult();}
    else{spawnShard(b.x,b.y,PAL.violet,3);}
  }
}
function updateEBullets(dt){
  const px=CX+game.player.x,py=CY+game.player.y;
  for(const b of game.ebullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(Math.hypot(b.x-px,b.y-py)<6){b.life=0;damagePlayer(1);}
  }
  game.ebullets=game.ebullets.filter(b=>b.life>0&&b.x>-50&&b.x<W+50&&b.y>-50&&b.y<H+50);
}
function updateShards(dt){
  for(const s of game.shards){
    s.t+=dt;s.z-=dt*0.15;
    if(s.z<=0.15){
      s.z=0.15;
      const dx=s.x-game.player.x,dy=s.y-game.player.y;
      s.x-=dx*dt*2;s.y-=dy*dt*2;
      if(Math.hypot(s.x-game.player.x,s.y-game.player.y)<40){
        applyPower(s.type);s.dead=true;
      }
    }
  }
  game.shards=game.shards.filter(s=>!s.dead);
}
function applyPower(type){
  sfxPower();
  if(type==='tear'){game.hp=Math.min(game.maxHp,game.hp+1);updateHalo();
    spawnShard(CX+game.player.x,CY+game.player.y,PAL.lime,10);}
  else if(type==='choir'){game.power.choir=8;}
  else if(type==='over'){game.power.over=BAR*4;flash=Math.max(flash,.3);}
}
function updateParticles(dt){
  for(const p of game.particles){
    p.life+=dt;
    if(p.shape!=='ring'&&p.shape!=='glyph'){
      p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;
      p.vx*=p.drag;p.vy*=p.drag;
      if(p.shape==='spark')p.vy+=30*dt;
    }
    p.rot+=p.vr;
  }
  game.particles=game.particles.filter(p=>p.life<p.max);
}
function addShake(v){if(!reduceMotion)shake=Math.max(shake,v);}
function updateHUD(){
  document.getElementById('scoreV').textContent=Math.floor(game.score).toLocaleString();
  document.getElementById('comboV').textContent='×'+comboMult().toFixed(1);
  document.getElementById('syncV').textContent=Math.round(game.sync)+'%';
  const pw=document.getElementById('power');
  let s='';
  if(game.power.choir>0)s+='<div class="p">CHOIR '+game.power.choir.toFixed(0)+'s</div>';
  if(game.power.over>0)s+='<div class="p">OVERCLOCK '+game.power.over.toFixed(0)+'s</div>';
  pw.innerHTML=s;
}

/* ---------- GAME RENDER ---------- */
function renderGame(){
  const sec=curSector();
  ctx.fillStyle=PAL.void;ctx.fillRect(0,0,W,H);
  drawNebula(tGlobal,0.6);
  drawStarfield(tGlobal*30,0.5);
  drawTunnel(sec);
  drawLyrics();
  const sorted=[...game.enemies].sort((a,b)=>b.z-a.z);
  for(const e of sorted)if(!e.dead)drawEnemy(e);
  if(game.boss)drawBoss(game.boss);
  ctx.globalCompositeOperation='lighter';
  for(const b of game.ebullets){
    ctx.fillStyle=rgba(b.col,.9);
    ctx.beginPath();ctx.arc(b.x,b.y,b.size,0,TAU);ctx.fill();
    ctx.fillStyle=rgba(PAL.bone,.5);
    ctx.beginPath();ctx.arc(b.x,b.y,b.size*.4,0,TAU);ctx.fill();
  }
  for(const b of game.bullets){
    ctx.fillStyle=rgba(b.col,.9);
    ctx.beginPath();ctx.arc(b.x,b.y,b.size,0,TAU);ctx.fill();
    ctx.fillStyle=rgba(PAL.bone,.7);
    ctx.beginPath();ctx.arc(b.x,b.y,b.size*.4,0,TAU);ctx.fill();
    if(b.harm){ctx.strokeStyle=rgba(b.col,.4);ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.02,b.y-b.vy*.02);ctx.stroke();}
  }
  for(const s of game.shards)drawShard(s);
  ctx.globalCompositeOperation='source-over';
  for(const e of game.lockTargets)if(!e.dead)drawLockMarker(e);
  drawPlayer();
  ctx.globalCompositeOperation='lighter';
  for(const p of game.particles)drawParticle(p);
  ctx.globalCompositeOperation='source-over';
  if(hitstop>0){ctx.fillStyle=rgba(PAL.bone,hitstop*2);ctx.fillRect(0,0,W,H);}
  if(game.iframes>0.8&&!filmMode)drawCrack();
  // film letterbox
  if(filmMode&&filmLetterbox){
    const lb=H*0.11;
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,lb);ctx.fillRect(0,H-lb,W,lb);
  }
}
/* C: strong readable pseudo-3D cathedral tunnel — always rendered, sector palette */
function drawTunnel(sec){
  const N=24;
  const baseR=Math.min(W,H)*.55;
  const isHeaven=game.sector===2;
  const isBoss=game.bossActive&&game.boss;
  ctx.globalCompositeOperation='lighter';
  for(let i=N-1;i>=0;i--){
    const f=i/N;
    const z=1-f;
    const scale=1/(0.2+z*1.5);
    const rad=baseR*scale*.5;
    const cx=CX+game.player.x*0.3*(1-z);
    const cy=CY+game.player.y*0.3*(1-z);
    const alpha=(1-z)*.4;
    const fog=1-z;
    let col=mix(sec.b,sec.a,fog);
    if(isBoss)col=mix(sec.b,sec.a,fog*.75);
    ctx.strokeStyle=rgba(col,alpha);
    ctx.lineWidth=2+(1-z)*3;
    ctx.beginPath();
    for(let k=0;k<8;k++){
      const a=k/8*TAU+tGlobal*.15;
      const px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad;
      k?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();ctx.stroke();
    ctx.fillStyle=rgba(sec.b,alpha*.15);
    ctx.fill();
    const bp=beatPulse*(1-z);
    if(bp>0.1){ctx.strokeStyle=rgba(sec.accent,bp*.6);ctx.lineWidth=4;
      ctx.beginPath();
      for(let k=0;k<8;k++){const a=k/8*TAU+tGlobal*.15;
        const px=cx+Math.cos(a)*rad*(1+bp*.05),py=cy+Math.sin(a)*rad*(1+bp*.05);
        k?ctx.lineTo(px,py):ctx.moveTo(px,py);}
      ctx.closePath();ctx.stroke();}
    if(i<N-1){
      const f2=(i+1)/N;
      const z2=1-f2;
      const scale2=1/(0.2+z2*1.5);
      const rad2=baseR*scale2*.5;
      const cx2=CX+game.player.x*0.3*(1-z2);
      const cy2=CY+game.player.y*0.3*(1-z2);
      ctx.strokeStyle=rgba(col,alpha*.3);ctx.lineWidth=1;
      for(let k=0;k<8;k++){
        const a=k/8*TAU+tGlobal*.15;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);
        ctx.lineTo(cx2+Math.cos(a)*rad2,cy2+Math.sin(a)*rad2);
        ctx.stroke();
      }
    }
    if(hash(i*3.3)>.7){
      const a=hash(i*7.7)*TAU;
      const px=cx+Math.cos(a)*rad*.8,py=cy+Math.sin(a)*rad*.8;
      ctx.fillStyle=rgba(sec.accent,alpha*.4);
      ctx.fillRect(px-4,py-4,8,8);
    }
  }
  // Heaven.exe iridescent glitch slices
  if(isHeaven&&!reduceMotion){
    for(let i=0;i<6;i++){
      if(hash(i*5.5+tGlobal*8)>.6){
        const y=rand(0,H);const h=rand(8,40);
        const off=rand(-30,30);
        ctx.globalAlpha=.3;
        ctx.drawImage(cv,0,y*DPR,W*DPR,h*DPR,off,y,W,h);
        ctx.globalAlpha=1;
      }
    }
  }
  // boss face embedded at vanishing point
  if(isBoss&&cache.boss){
    const vpR=baseR*0.5*0.2;
    ctx.globalAlpha=.7;
    ctx.drawImage(cache.boss,CX-vpR*.7,CY-vpR*.8,vpR*1.4,vpR*1.6);
    ctx.globalAlpha=1;
  }
  // sector-specific particles
  if(game.sector===1){
    for(let i=0;i<20;i++){
      const x=hash(i*3.1)*W,y=(hash(i*7.7)*H+tGlobal*20)%H;
      ctx.fillStyle=rgba(PAL.cyan,.3);
      ctx.fillRect(x,y,2,2);
    }
  }
  ctx.globalCompositeOperation='source-over';
}
function drawLyrics(){
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    const cycle=(tGlobal*0.05+i*0.33)%1;
    const idx=Math.floor((tGlobal*0.05+i*0.33)*LYRICS.length)%LYRICS.length;
    const y=CY-cycle*H;
    const a=Math.sin(cycle*Math.PI)*.3;
    ctx.font='italic 22px '+getSerif();ctx.textAlign='center';
    ctx.fillStyle=rgba(PAL.bone,a);
    ctx.fillText(LYRICS[idx],CX,y);
  }
  ctx.globalCompositeOperation='source-over';
}
function drawEnemy(e){
  const x=CX+e.x,y=CY+e.y;
  const s=lerp(15,70,1-e.z);
  ctx.save();ctx.translate(x,y);
  ctx.globalCompositeOperation='lighter';
  if(e.type==='moth'){
    const flap=Math.sin(e.t*8)*.4;
    for(const d of[-1,1]){
      const wg=ctx.createLinearGradient(0,0,d*s,0);
      wg.addColorStop(0,rgba(e.color,.6));wg.addColorStop(1,rgba(e.color,.2));
      ctx.fillStyle=wg;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(d*s*.9,-s*.7+flap*s*.3,d*s*1.1,s*.2);
      ctx.quadraticCurveTo(d*s*.5,s*.6,0,0);ctx.fill();
      ctx.strokeStyle=rgba(PAL.bone,.3);ctx.lineWidth=1;
      for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(d*s*.2*i,-s*.1);
        ctx.quadraticCurveTo(d*s*.5*i,-s*.3,d*s*.8*i,s*.1);ctx.stroke();}
    }
    ctx.fillStyle=rgba(PAL.bone,.9);ctx.beginPath();ctx.arc(0,0,s*.2,0,TAU);ctx.fill();
    ctx.fillStyle=rgba(PAL.magenta,.9);
    ctx.beginPath();ctx.arc(-s*.1,-s*.05,s*.06,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(s*.1,-s*.05,s*.06,0,TAU);ctx.fill();
  } else if(e.type==='seraph'){
    for(let w=0;w<3;w++){
      const wa=w/3*TAU+e.t*.5;
      const wg=ctx.createLinearGradient(0,0,Math.cos(wa)*s,Math.sin(wa)*s);
      wg.addColorStop(0,rgba(PAL.bone,.6));wg.addColorStop(1,rgba(e.color,.3));
      ctx.fillStyle=wg;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(Math.cos(wa)*s*.6,Math.sin(wa)*s*.6-s*.2,Math.cos(wa)*s,Math.sin(wa)*s);
      ctx.quadraticCurveTo(Math.cos(wa)*s*.4,Math.sin(wa)*s*.4+s*.2,0,0);ctx.fill();
    }
    ctx.strokeStyle=rgba(e.color,.9);ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,s*.4,0,TAU);ctx.stroke();
    if(e.shield){
      ctx.strokeStyle=rgba(PAL.cyan,.6+Math.sin(e.t*4)*.3);ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,s*.9,0,TAU);ctx.stroke();
      ctx.strokeStyle=rgba(PAL.cyan,.3);ctx.lineWidth=1;
      ctx.beginPath();
      for(let i=0;i<6;i++){const a=i/6*TAU+e.t;
        const px=Math.cos(a)*s*.9,py=Math.sin(a)*s*.9;
        i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
      ctx.closePath();ctx.stroke();
    }
  } else if(e.type==='hulk'){
    const hg=ctx.createLinearGradient(-s,-s,s,s);
    hg.addColorStop(0,PAL.rust);hg.addColorStop(.5,'#5a2a12');hg.addColorStop(1,PAL.violet);
    ctx.fillStyle=hg;
    ctx.beginPath();
    for(let i=0;i<7;i++){const a=i/7*TAU+e.t*.3;const rr=s*(.7+hash(i*2)*.5);
      const px=Math.cos(a)*rr,py=Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=rgba(PAL.rust,.6);ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle=rgba(PAL.magenta,.7);ctx.lineWidth=2;
    for(let i=0;i<3;i++){const a=hash(i*5.5)*TAU;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*s*.6,Math.sin(a)*s*.6);ctx.stroke();}
  } else if(e.type==='wraith'){
    ctx.globalAlpha=.6+Math.sin(e.t*10)*.3;
    ctx.fillStyle=rgba(PAL.cyan,.5);
    ctx.beginPath();ctx.arc(-3,0,s*.6,0,TAU);ctx.fill();
    ctx.fillStyle=rgba(PAL.magenta,.5);
    ctx.beginPath();ctx.arc(3,0,s*.6,0,TAU);ctx.fill();
    ctx.fillStyle=rgba(PAL.bone,.7);
    ctx.beginPath();ctx.arc(0,0,s*.5,0,TAU);ctx.fill();
    for(let i=0;i<5;i++){const sy=-s*.4+i*s*.2;
      ctx.fillStyle=rgba(PAL.void,.4);ctx.fillRect(-s*.5,sy,s,s*.05);}
    ctx.globalAlpha=1;
  }
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=rgba(PAL.void,.6);ctx.fillRect(-s*.6,-s*.9,s*1.2,3);
  ctx.fillStyle=rgba(e.color,.9);ctx.fillRect(-s*.6,-s*.9,s*1.2*(e.hp/e.maxhp),3);
  ctx.restore();
}
function drawLockMarker(e){
  const x=CX+e.x,y=CY+e.y;
  const s=lerp(15,70,1-e.z);
  ctx.strokeStyle=rgba(PAL.cyan,.8);ctx.lineWidth=2;
  const r=s*1.1;
  for(let i=0;i<4;i++){const a=i/4*TAU+Math.PI/4;
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);
    ctx.lineTo(x+Math.cos(a+.4)*r,y+Math.sin(a+.4)*r);
    ctx.stroke();}
}
function drawBoss(b){
  const x=CX+b.x,y=CY+b.y;
  ctx.save();ctx.translate(x,y);
  ctx.globalCompositeOperation='lighter';
  const S=Math.min(W,H)*.3;
  ctx.strokeStyle=rgba(PAL.magenta,.6);ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-S*.6,S*.6);ctx.lineTo(-S*.6,-S*.2);
  ctx.quadraticCurveTo(-S*.6,-S*.7,0,-S*.8);
  ctx.quadraticCurveTo(S*.6,-S*.7,S*.6,-S*.2);
  ctx.lineTo(S*.6,S*.6);ctx.stroke();
  ctx.strokeStyle=rgba(PAL.bone,.5);ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(-S*.3,-S*.1);ctx.lineTo(-S*.15,-S*.1);
  ctx.moveTo(S*.15,-S*.1);ctx.lineTo(S*.3,-S*.1);
  ctx.moveTo(-S*.2,S*.3);ctx.quadraticCurveTo(0,S*.4,S*.2,S*.3);
  ctx.stroke();
  ctx.fillStyle=rgba(PAL.magenta,.8);
  ctx.beginPath();ctx.arc(-S*.22,-S*.1,6,0,TAU);ctx.fill();
  ctx.beginPath();ctx.arc(S*.22,-S*.1,6,0,TAU);ctx.fill();
  for(const p of b.pipes){
    const px=Math.cos(p.a)*p.r,py=Math.sin(p.a)*p.r*.6;
    ctx.strokeStyle=rgba(PAL.cyan,.6);ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(px,py);
    ctx.lineTo(px+Math.cos(p.a)*p.len,py+Math.sin(p.a)*p.len*.6);ctx.stroke();
  }
  for(const w of b.weak){
    const wx=Math.cos(w.a)*w.r,wy=Math.sin(w.a)*w.r*.6;
    const alive=w.hp>0;
    ctx.fillStyle=rgba(alive?PAL.lime:PAL.violet,.5+w.flash*.5);
    ctx.beginPath();ctx.arc(wx,wy,alive?12:6,0,TAU);ctx.fill();
    if(alive){ctx.strokeStyle=rgba(PAL.bone,.5);ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(wx,wy,16,0,TAU);ctx.stroke();}
  }
  ctx.restore();
  ctx.globalCompositeOperation='source-over';
  const bw=Math.min(W*.5,400),bx=CX-bw/2,by=CY-H*.32;
  ctx.fillStyle=rgba(PAL.void,.7);ctx.fillRect(bx-4,by-4,bw+8,16);
  ctx.strokeStyle=rgba(PAL.magenta,.6);ctx.lineWidth=2;ctx.strokeRect(bx-4,by-4,bw+8,16);
  ctx.fillStyle=rgba(PAL.magenta,.8);ctx.fillRect(bx,by,bw*(b.hp/b.maxhp),8);
  ctx.font='11px '+getMono();ctx.textAlign='center';ctx.fillStyle=rgba(PAL.bone,.8);
  ctx.fillText('THE ROTTING CHOIR',CX,by-10);
}
function drawShard(s){
  const x=CX+s.x,y=CY+s.y;
  const col=s.type==='tear'?PAL.lime:s.type==='choir'?PAL.cyan:PAL.magenta;
  ctx.save();ctx.translate(x,y);ctx.rotate(s.t*2);
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=rgba(col,.8);
  ctx.beginPath();
  ctx.moveTo(0,-10);ctx.lineTo(8,0);ctx.lineTo(0,10);ctx.lineTo(-8,0);ctx.closePath();ctx.fill();
  ctx.fillStyle=rgba(PAL.bone,.9);
  ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(4,0);ctx.lineTo(0,4);ctx.lineTo(-4,0);ctx.closePath();ctx.fill();
  ctx.restore();ctx.globalCompositeOperation='source-over';
}
function drawPlayer(){
  const pl=game.player;
  const x=CX+pl.x,y=CY+pl.y;
  ctx.save();ctx.translate(x,y);ctx.rotate(pl.bank);
  ctx.globalCompositeOperation='lighter';
  const pulse=1+beatPulse*.15;
  for(const d of[-1,1]){
    const flap=Math.sin(tGlobal*6)*.2;
    for(let i=0;i<12;i++){
      const f=i/12;
      const a=d*(.3+f*1.2);
      const len=35*(1-f*.3);
      const wg=ctx.createLinearGradient(0,0,Math.cos(a)*len*d,Math.sin(a)*len);
      wg.addColorStop(0,rgba(curSector().accent,.6*pulse));
      wg.addColorStop(1,rgba(PAL.bone,.2*pulse));
      ctx.strokeStyle=wg;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.quadraticCurveTo(Math.cos(a)*len*.5*d,Math.sin(a)*len*.5-flap*8,Math.cos(a)*len*d,Math.sin(a)*len);
      ctx.stroke();
    }
  }
  ctx.strokeStyle=rgba(curSector().accent,.4);ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,10);
  ctx.quadraticCurveTo(Math.sin(tGlobal*8)*5,25,Math.sin(tGlobal*8)*8,40);ctx.stroke();
  const coreG=ctx.createRadialGradient(0,0,0,0,0,12);
  coreG.addColorStop(0,rgba(PAL.bone,.9));coreG.addColorStop(.5,rgba(curSector().accent,.6));coreG.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=coreG;ctx.beginPath();ctx.arc(0,0,12,0,TAU);ctx.fill();
  ctx.fillStyle=rgba(PAL.bone,.9);
  ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(8,4);ctx.lineTo(0,10);ctx.lineTo(-8,4);ctx.closePath();ctx.fill();
  ctx.strokeStyle=rgba(PAL.bone,.7);ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(0,-18,10,4,0,0,TAU);ctx.stroke();
  ctx.fillStyle=rgba(PAL.bone,.5);ctx.beginPath();ctx.arc(0,0,6,0,TAU);ctx.fill();
  if(pl.firing){ctx.fillStyle=rgba(PAL.bone,.8);
    ctx.beginPath();ctx.arc(0,-16,4+Math.random()*3,0,TAU);ctx.fill();}
  if(game.iframes>0&&Math.floor(tGlobal*20)%2===0){ctx.globalAlpha=.4;}
  ctx.restore();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  // circular lock/reticle meter around the crosshair (not over HUD)
  if(pl.lock){
    ctx.save();ctx.translate(pointer.x,pointer.y);
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=rgba(PAL.cyan,.8);ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,22,0,TAU);ctx.stroke();
    ctx.strokeStyle=rgba(PAL.magenta,.6);ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,22,-Math.PI/2,-Math.PI/2+TAU*(pl.lockT/0.12));ctx.stroke();
    for(let i=0;i<4;i++){const a=i/4*TAU+tGlobal*2;
      ctx.strokeStyle=rgba(PAL.cyan,.7);ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*26,Math.sin(a)*26);
      ctx.lineTo(Math.cos(a)*32,Math.sin(a)*32);ctx.stroke();}
    ctx.restore();ctx.globalCompositeOperation='source-over';
  }
}
function drawParticle(p){
  const a=1-p.life/p.max;
  if(p.shape==='shard'){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=rgba(p.color,a);
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.4);
    ctx.restore();
  } else if(p.shape==='ring'){
    const r=p.size*(p.life/p.max)*3;
    ctx.strokeStyle=rgba(p.color,a);ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,TAU);ctx.stroke();
  } else if(p.shape==='glyph'){
    drawGlyph(p.x,p.y,p.size,p.rot,rgba(p.color,a),a);
  } else {
    ctx.fillStyle=rgba(p.color,a);
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*a,0,TAU);ctx.fill();
  }
}
function drawCrack(){
  ctx.strokeStyle=rgba(PAL.bone,.3);ctx.lineWidth=1;
  for(let i=0;i<8;i++){
    const a=i/8*TAU+hash(i*3)*.5;
    ctx.beginPath();ctx.moveTo(CX,CY);
    let x=CX,y=CY;
    for(let j=0;j<5;j++){x+=Math.cos(a)*40+rand(-20,20);y+=Math.sin(a)*40+rand(-20,20);
      ctx.lineTo(x,y);}
    ctx.stroke();
  }
}

/* =====================================================================
   END STATES
   ===================================================================== */
let endT=0, endParticles=[];
function loseGame(){
  state=ST.OVER;stopMusic();
  setBest(Math.floor(game.score));
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('touchLock').classList.add('hidden');
  document.getElementById('menu').classList.add('hidden');
  const end=document.getElementById('end');end.classList.remove('hidden');
  for(const id of ['grade','endStats'])document.getElementById(id).style.display=filmMode?'none':'';
  end.lastElementChild.style.display=filmMode?'none':'';
  end.style.transform='';
  document.getElementById('grade').textContent='SIGNAL LOST';
  document.getElementById('grade').style.color=PAL.rust;
  document.getElementById('grade').style.textShadow='0 0 40px '+PAL.rust+',6px 0 0 '+PAL.rust+',-6px 0 0 '+PAL.magenta;
  document.getElementById('endStats').innerHTML=
    'SCORE <span class="v">'+Math.floor(game.score).toLocaleString()+'</span><br>'+
    'BEST <span class="v">'+getBest().toLocaleString()+'</span><br>'+
    'SYNC <span class="lv2">'+Math.round(game.sync)+'%</span> · MAX COMBO <span class="lv">×'+comboMult().toFixed(1)+'</span>';
  endParticles=[];
  for(let i=0;i<120;i++)endParticles.push({x:rand(0,W),y:rand(0,H),vx:rand(-2,2),vy:rand(-2,2),
    size:rand(2,8),color:Math.random()<.5?PAL.rust:PAL.magenta,life:0,max:rand(1,3)});
  endT=0;
}
function winGame(){
  state=ST.ENDING;stopMusic();
  setBest(Math.floor(game.score));
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('touchLock').classList.add('hidden');
  document.getElementById('menu').classList.add('hidden');
  const end=document.getElementById('end');end.classList.remove('hidden');
  for(const id of ['grade','endStats'])document.getElementById(id).style.display=filmMode?'none':'';
  end.lastElementChild.style.display=filmMode?'none':'';
  end.style.transform='translateY(-22vh)';
  const grade=game.sync>90?'S':game.sync>70?'A':game.sync>50?'B':'C';
  document.getElementById('grade').textContent=grade;
  const gc=grade==='S'?PAL.lime:grade==='A'?PAL.cyan:grade==='B'?PAL.magenta:PAL.bone;
  document.getElementById('grade').style.color=gc;
  document.getElementById('grade').style.textShadow='0 0 40px '+gc+',6px 0 0 '+PAL.magenta+',-6px 0 0 '+PAL.cyan;
  document.getElementById('endStats').innerHTML=
    'SCORE <span class="v">'+Math.floor(game.score).toLocaleString()+'</span><br>'+
    'BEST <span class="v">'+getBest().toLocaleString()+'</span><br>'+
    'SYNC <span class="lv2">'+Math.round(game.sync)+'%</span> · MAX COMBO <span class="lv">×'+comboMult().toFixed(1)+'</span><br>'+
    'HARMONIC <span class="lv">'+Math.round(game.harm/Math.max(1,game.shots)*100)+'%</span>';
  const targets=sampleTextTargets('YOU ARE THE LAST SONG',200);
  endParticles=[];
  for(let i=0;i<200;i++){
    const tg=targets[i]||{x:rand(0,W),y:CY};
    endParticles.push({x:rand(0,W),y:rand(0,H),vx:rand(-3,3),vy:rand(-3,3),
      size:rand(2,5),color:irid(i/200),life:0,max:rand(2,5),tx:tg.x,ty:tg.y});
  }
  endT=0;
}
function retry(){
  document.getElementById('end').classList.add('hidden');
  if(filmMode){exitFilm();return;}
  startGame();
}
function renderEnd(dt){
  endT+=dt;
  ctx.fillStyle=PAL.void;ctx.fillRect(0,0,W,H);
  if(state===ST.OVER){
    ctx.globalCompositeOperation='lighter';
    for(const p of endParticles){
      p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.life+=dt;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      const a=Math.max(0,1-p.life/p.max);
      ctx.fillStyle=rgba(p.color,a*.5);
      ctx.fillRect(p.x,p.y,p.size,p.size*.3);
    }
    ctx.globalCompositeOperation='source-over';
    if(!reduceMotion){
      const y=(tGlobal*200)%H;
      ctx.fillStyle=rgba(PAL.magenta,.1);ctx.fillRect(0,y,W,4);
    }
  } else {
    const prog=clamp(endT/4,0,1);
    const credFade=filmMode?clamp((endT-5.5)/1.2,0,1):0;
    ctx.save();ctx.translate(0,-clamp(endT/14,0,1)*H*.35+(1-prog)*H*.15);
    drawAngel(tGlobal,(.35+.4*prog)*(1-credFade*.45));
    ctx.restore();
    ctx.globalCompositeOperation='lighter';
    const text='YOU ARE THE LAST SONG';
    ctx.font='bold 40px '+getSerif();ctx.textAlign='center';ctx.textBaseline='middle';
    for(let i=0;i<endParticles.length;i++){
      const p=endParticles[i];
      p.x=lerp(p.x,p.tx,dt*2*prog);
      p.y=lerp(p.y,p.ty,dt*2*prog);
      const a=prog*.8*(1-credFade);
      ctx.fillStyle=rgba(p.color,a);
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    if(prog>0.7){
      const a=clamp((prog-.7)/.3,0,1)*(1-credFade);
      ctx.font='bold 40px '+getSerif();ctx.textAlign='center';
      ctx.fillStyle=rgba(PAL.bone,a);
      ctx.fillText(text,CX,CY+H*.25);
      ctx.font='13px '+getMono();
      ctx.fillStyle=rgba(PAL.rust,a);
      ctx.fillText('— the requiem is complete —',CX,CY+H*.25+40);
    }
  }
  if(filmMode)drawCredits();
  if(filmMode&&filmLetterbox){
    const lb=H*0.11;
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,lb);ctx.fillRect(0,H-lb,W,lb);
  }
}

/* =====================================================================
   POST-PROCESS
   ===================================================================== */
let quality=1, perfAccum=0, perfCount=0;
function postProcess(){
  if(crtOn){
    bctx.globalCompositeOperation='source-over';
    bctx.filter='blur(4px) brightness(1.3)';
    bctx.drawImage(cv,0,0,bloom.width,bloom.height);
    bctx.filter='none';
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=.5+audioBass*.4;
    ctx.drawImage(bloom,0,0,W,H);
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
    if(!reduceMotion){
      const off=1+audioBass*3+beatFlash*3;
      ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=.08+beatFlash*.05;
      ctx.drawImage(cv,off,0);
      ctx.globalAlpha=.08+beatFlash*.05;
      ctx.drawImage(cv,-off,0);
      ctx.globalAlpha=1;
      ctx.globalCompositeOperation='source-over';
    }
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(0,0,0,0.12)';
    for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
    ctx.globalAlpha=.06;
    ctx.drawImage(grain,rand(-10,10),rand(-10,10),W,H);
    ctx.globalAlpha=1;
    if(!reduceMotion){
      const lx=CX+Math.sin(tGlobal*.3)*W*.4;
      const lg=ctx.createRadialGradient(lx,CY,0,lx,CY,W*.3);
      lg.addColorStop(0,rgba(PAL.magenta,.04));lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);
      const rx=CX+Math.cos(tGlobal*.2)*W*.4;
      const rg=ctx.createRadialGradient(rx,CY,0,rx,CY,W*.3);
      rg.addColorStop(0,rgba(PAL.rust,.04));rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
    }
    const vg=ctx.createRadialGradient(CX,CY,Math.min(W,H)*.3,CX,CY,Math.max(W,H)*.7);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.6)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }
  if(flash>0){ctx.fillStyle=rgba(PAL.bone,flash*.5);ctx.fillRect(0,0,W,H);}
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastTime=0;
function loop(now){
  let dt=Math.min(.05,(now-lastTime)/1000||0);
  lastTime=now;
  tGlobal+=dt;
  if(hitstop>0){hitstop-=dt;dt*=0.2;}
  shake*=Math.pow(0.001,dt);
  if(shake<.1)shake=0;
  flash=Math.max(0,flash-dt*3);
  perfAccum+=dt;perfCount++;
  if(perfCount>=120){
    const avg=perfAccum/perfCount*1000;
    if(avg>22&&quality>0.5){quality=0.5;bloom.width=Math.max(2,W>>2);bloom.height=Math.max(2,H>>2);MAXP=300;}
    perfAccum=0;perfCount=0;
  }
  if(filmMode)filmDirector(dt);
  {const sk=document.getElementById('skip');const want=state===ST.INTRO&&!filmMode;if(sk.classList.contains('hidden')===want)sk.classList.toggle('hidden',!want);}
  ctx.save();
  if(shake>0&&!reduceMotion){
    ctx.translate(rand(-shake,shake),rand(-shake,shake));
  }
  switch(state){
    case ST.BOOT:
      ctx.fillStyle=PAL.void;ctx.fillRect(0,0,W,H);
      drawStatic(0.15+0.1*Math.sin(tGlobal*2));
      break;
    case ST.INTRO:
      introT+=dt;
      renderIntro(introT);
      break;
    case ST.TITLE:
      ctx.fillStyle=PAL.void;ctx.fillRect(0,0,W,H);
      drawStarfield(tGlobal*20,0.4);
      drawNebula(tGlobal,0.4);
      drawAngel(tGlobal,0.6);
      drawStation(tGlobal,0.3);
      break;
    case ST.GAME:case ST.BOSS:
      updateGame(dt);
      renderGame();
      if(filmMode)drawChapterCard();
      break;
    case ST.ENDING:case ST.OVER:
      renderEnd(dt);
      break;
  }
  ctx.restore();
  postProcess();
  if((state===ST.GAME||state===ST.BOSS)&&beatFlash>0&&!reduceMotion){
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=rgba(curSector().accent,beatFlash*.06);
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
  }
  requestAnimationFrame(loop);
}
resize();
buildHalo();
// hide record button on boot if not supported
if(!recSupported())document.getElementById('bootRec').classList.add('hidden');
requestAnimationFrame(loop);
</script>
