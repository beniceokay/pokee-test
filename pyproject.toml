[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-pokee"
description = "Pokee Isaac for Claude Code: pokee-isaac in the /model picker via a local Anthropic-API router, plus MCP build tools."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marco van Hylckama Vlieg", email = "marcovhv@gmail.com" }]
keywords = ["claude", "claude-code", "pokee", "isaac", "anthropic", "proxy", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/TheMarco/claude-pokee"
Issues = "https://github.com/TheMarco/claude-pokee/issues"

[project.scripts]
claude-pokee = "claude_pokee.cli:main"

[tool.setuptools]
packages = ["claude_pokee"]

[tool.setuptools.dynamic]
version = { attr = "claude_pokee.__version__" }
