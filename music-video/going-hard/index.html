<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOING HARD</title>
<style>
  :root{
    --red:#E1251B; --red2:#D7261E; --ivory:#F4EFE6; --mid:#0B0F1A;
    --green:#3BE28A; --amber:#FFB020;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#05070d;overflow:hidden;font-family:'Inter Tight',sans-serif}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  .hidden{display:none !important}
  #play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    pointer-events:auto;cursor:pointer;color:var(--ivory);
    font-family:'Inter Tight',sans-serif;font-weight:900;letter-spacing:.35em;
    font-size:clamp(14px,1.6vw,20px);display:flex;align-items:center;gap:.7em;
    padding:1.1em 1.6em;border:1px solid rgba(244,239,230,.55);
    background:rgba(11,15,26,.55);backdrop-filter:blur(6px);
    transition:all .35s cubic-bezier(.16,1,.3,1);user-select:none}
  #play:hover{background:rgba(225,37,27,.85);border-color:var(--red);letter-spacing:.45em}
  #play .tri{font-size:.8em;transform:translateY(-1px)}
  #play .brand{position:absolute;top:-1.9em;left:50%;transform:translateX(-50%);
    font-weight:600;font-size:.62em;letter-spacing:.5em;opacity:.7;white-space:nowrap}
  #scrub{position:absolute;left:0;right:0;bottom:0;height:26px;pointer-events:auto;cursor:pointer}
  #scrubTrack{position:absolute;left:0;right:0;bottom:11px;height:3px;background:rgba(244,239,230,.18)}
  #scrubFill{position:absolute;left:0;bottom:11px;height:3px;width:0;background:var(--red);box-shadow:0 0 8px rgba(225,37,27,.8)}
  #scrubKnob{position:absolute;bottom:6px;width:13px;height:13px;border-radius:50%;background:var(--ivory);
    transform:translateX(-50%);box-shadow:0 0 10px rgba(244,239,230,.6);opacity:0;transition:opacity .3s}
  #scrub:hover #scrubKnob{opacity:1}
  #hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);color:rgba(244,239,230,.5);
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;pointer-events:none}
  #ready{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--ivory);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.3em;
    background:#05070d;z-index:20;transition:opacity .6s}
  #ready .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);
    margin-right:12px;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
  @media (max-width:640px){#play{font-size:13px;letter-spacing:.28em}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui" class="hidden">
  <div id="play"><span class="brand">POKEE — ON-PREM</span><span class="tri">▶</span><span id="playLbl">PLAY</span></div>
  <div id="scrub"><div id="scrubTrack"></div><div id="scrubFill"></div><div id="scrubKnob"></div></div>
  <div id="hint">SPACE — PLAY/PAUSE · CLICK SCRUBBER TO SEEK</div>
</div>
<div id="ready"><span class="dot"></span>PREPARING SECURE ENCLAVE…</div>

<script src="timeline.js"></script>
<script src="footage2.js"></script>
<script>
(function(){
"use strict";
/* ============================================================
   POKEE — ON-PREM  |  deterministic real-time WebGL render engine
   ============================================================ */

/* ---------- palette ---------- */
const C={
  red:[0.882,0.145,0.106], red2:[0.843,0.149,0.118],
  ivory:[0.957,0.937,0.902], mid:[0.043,0.059,0.102],
  green:[0.231,0.886,0.541], amber:[1.0,0.690,0.125]
};

/* ---------- deterministic RNG (pure) ---------- */
function h2(a,b){ let h=(a*374761393 + b*668265263)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967295; }
function rand(a,b){ return h2((a|0)+1,(b|0)+1); }
function h1(a){ let h=(a*2654435761)|0; h=(h^(h>>>16))*2246822519|0; return ((h^(h>>>13))>>>0)/4294967295; }

/* ---------- easing ---------- */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
const easeInOutCubic=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeInOutSine=t=>-(Math.cos(Math.PI*t)-1)/2;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeOutQuint=t=>1-Math.pow(1-t,5);

/* ---------- timeline refs ---------- */
const TL=window.TIMELINE||{duration:243.19,fps_env:30,tempo:143.55,beats:[],downbeats:[],kicks:[],
  sections:[],shots:[],lyrics:[],events:[],images:[],env:{rms:[],low:[],high:[]}};
const DUR=TL.duration||243.19;
const FPS=TL.fps_env||30;
const BEATS=TL.beats||[], DOWNS=TL.downbeats||[], KICKS=TL.kicks||[];
const SECTIONS=TL.sections||[], SHOTS=TL.shots||[], LYRICS=TL.lyrics||[], EVENTS=TL.events||[],
      IMAGES=TL.images||[], ENV=TL.env||{rms:[],low:[],high:[]};
const NUMSHOTS=SHOTS.length, NUMIMG=IMAGES.length;

/* ---------- binary search helpers ---------- */
function lowerBound(arr,t){ let lo=0,hi=arr.length; while(lo<hi){const m=(lo+hi)>>1; if(arr[m]<t)lo=m+1; else hi=m;} return lo; }
function upperBound(arr,t){ let lo=0,hi=arr.length; while(lo<hi){const m=(lo+hi)>>1; if(arr[m]<=t)lo=m+1; else hi=m;} return lo; }
function shotIndexAt(t){
  if(!SHOTS.length) return 0;
  t=clamp(t,0,DUR);
  let lo=0,hi=SHOTS.length-1,ans=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(SHOTS[m].start<=t){ans=m;lo=m+1;} else hi=m-1;}
  return ans;
}
function sectionIndexAt(t){
  if(!SECTIONS.length) return 0;
  t=clamp(t,0,DUR);
  let lo=0,hi=SECTIONS.length-1,ans=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(SECTIONS[m].start<=t){ans=m;lo=m+1;} else hi=m-1;}
  return ans;
}
function envVal(arr,t){
  if(!arr||arr.length<2) return 0;
  const f=clamp(t*FPS,0,arr.length-1);
  const i=Math.floor(f), fr=f-i, a=arr[i]||0, b=arr[Math.min(i+1,arr.length-1)]||0;
  return lerp(a,b,fr)/255;
}
function nearest(arr,t){ if(!arr.length)return t; let lo=0,hi=arr.length-1; if(t<=arr[0])return arr[0]; if(t>=arr[hi])return arr[hi];
  while(lo<=hi){const m=(lo+hi)>>1; if(arr[m]<=t&&arr[m+1]>t){return (t-arr[m])<(arr[m+1]-t)?arr[m]:arr[m+1];} if(arr[m]<t)lo=m+1; else hi=m-1;} return arr[hi]; }

/* ---------- shot / camera model ---------- */
function shotTransform(idx,t){
  const s=SHOTS[idx]; const dur=Math.max(0.0001,s.end-s.start);
  const p=clamp((t-s.start)/dur,0,1);
  const e=easeInOutSine(p);
  const mv=s.move||'pushin';
  let scale=1.08, ox=0, oy=0;
  if(mv==='pushin'){ scale=lerp(1.08,1.18,e); }
  else if(mv==='pullout'){ scale=lerp(1.20,1.08,e); }
  else if(mv==='panleft'){ scale=1.10; ox=lerp(0.05,-0.05,e); }
  else if(mv==='panright'){ scale=1.10; ox=lerp(-0.05,0.05,e); }
  else if(mv==='tiltup'){ scale=1.10; oy=lerp(0.05,-0.05,e); }
  else if(mv==='tiltdown'){ scale=1.10; oy=lerp(-0.05,0.05,e); }
  else if(mv==='punch'){ scale=lerp(1.08,1.18,e); }
  else { scale=1.08+0.05*Math.sin(e*Math.PI); }
  return {scale,ox,oy,focus:s.focus||[0.5,0.5],img:s.img};
}
function punchBump(t){
  let best=-1;
  for(let i=KICKS.length-1;i>=0;i--){ const k=KICKS[i]; if(k<=t){ best=k; break; } }
  if(best<0) return 0;
  const dt=t-best; if(dt>0.15) return 0;
  return 1.015*Math.exp(-dt/0.05);
}
function downPulse(t,mood){
  if(mood!=='chorus') return 1;
  let best=-1; for(let i=DOWNS.length-1;i>=0;i--){ if(DOWNS[i]<=t){best=DOWNS[i];break;} }
  if(best<0) return 1; const dt=t-best; if(dt>0.12) return 1;
  return 1+0.006*Math.exp(-dt/0.04);
}

/* ---------- mood grade ---------- */
function moodParams(mood){
  switch(mood){
    case 'vault':   return {sat:0.72,contrast:1.06,exposure:0.95,cool:0.30,warm:0.0,crush:0.30,letterbox:1.0,red:0.0,scan:0.0};
    case 'bridge':  return {sat:0.74,contrast:1.04,exposure:0.96,cool:0.24,warm:0.02,crush:0.26,letterbox:1.0,red:0.0,scan:0.0};
    case 'drop':    return {sat:1.28,contrast:1.18,exposure:1.06,cool:-0.05,warm:0.12,crush:0.0,letterbox:0.0,red:0.10,scan:0.0};
    case 'chorus':  return {sat:1.24,contrast:1.16,exposure:1.05,cool:-0.04,warm:0.10,crush:0.0,letterbox:0.0,red:0.12,scan:0.0};
    case 'verse':   return {sat:1.02,contrast:1.05,exposure:1.0,cool:0.02,warm:0.03,crush:0.0,letterbox:0.0,red:0.0,scan:0.0};
    case 'build':   return {sat:1.08,contrast:1.10,exposure:1.02,cool:0.05,warm:0.05,crush:0.0,letterbox:0.0,red:0.04,scan:0.0};
    case 'denied':  return {sat:0.70,contrast:1.10,exposure:0.98,cool:0.0,warm:0.0,crush:0.05,letterbox:0.0,red:0.55,scan:0.5};
    case 'outro':   return {sat:0.82,contrast:0.98,exposure:0.90,cool:0.06,warm:0.16,crush:0.10,letterbox:0.0,red:0.0,scan:0.0};
    default:        return {sat:1.0,contrast:1.05,exposure:1.0,cool:0.0,warm:0.0,crush:0.0,letterbox:0.0,red:0.0,scan:0.0};
  }
}
function gradeAt(t){
  const si=sectionIndexAt(t); const sec=SECTIONS[si]||{mood:'verse',start:0};
  const cur=moodParams(sec.mood);
  let prev=moodParams(sec.mood);
  if(si>0){ const p=SECTIONS[si-1]; prev=moodParams(p.mood); const b=sec.start;
    const x=clamp((t-b)/0.5,0,1);
    for(const k in cur) cur[k]=lerp(prev[k],cur[k],x);
  }
  return {params:cur,mood:sec.mood,sec:sec};
}

/* ---------- transition durations ---------- */
const TDUR={cut:0,fadein:2.0,flash:0.28,glitch:0.32,stripe:0.5,whip:0.36,slice:0.42,zoom:0.4,shutter:0.3,punch:0.22,rgb:0.32,dissolve:1.2,lightleak:1.4,lumafade:1.8};
const TID={cut:0,fadein:1,flash:2,glitch:3,stripe:4,whip:5,slice:6,zoom:7,shutter:8,punch:9,rgb:10,dissolve:11,lightleak:12,lumafade:13};

/* ============================================================
   WEBGL
   ============================================================ */
const canvas=document.getElementById('gl');
let gl=null, glOK=false;
let progMain, progBloom, progDown, progPost;
let quadBuf;
let texA=null, texB=null, texC=null, texText=null, bloomTex=null;
let bloomW=0, bloomH=0;
let W=0,H=0,dpr=1;

const VS=`attribute vec2 aPos; varying vec2 vUV; void main(){ vUV=aPos*0.5+0.5; gl_Position=vec4(aPos,0.0,1.0); }`;

const FS_MAIN2=`
precision highp float;
varying vec2 vUV;
uniform sampler2D uA,uB,uC;
uniform vec2 uAUV,uBUV,uCUV;
uniform vec2 uAR,uBR,uCR;
uniform float uARot,uBRot,uCRot;
uniform float uAOp,uBOp,uCOp;
uniform int uT; uniform float uP; uniform float uLay;
uniform vec2 uRes;
uniform float uTime;
float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }
float hash21(vec2 p, float t){ p=fract(p*vec2(123.34,456.21)+t*0.31); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec2 rot(vec2 uv,float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c)*(uv-0.5)+0.5; }
float eoe(float t){ return t>=1.0?1.0:1.0-pow(2.0,-10.0*t); }
float eob(float t){ float c1=1.70158,c3=c1+1.0; return 1.0+c3*pow(t-1.0,3.0)+c1*pow(t-1.0,2.0); }
vec3 sampleShot(sampler2D tx, vec2 uv, vec2 uvC, vec2 r, float ro, float op){
  vec2 p=(uv-uvC)/r; p=rot(p,ro); vec2 s=uLay>0.5?uv:uvC+r*0.5*p;
  vec3 col=texture2D(tx,s).rgb; return col*op;
}
void main(){
  vec2 uv=vUV; vec3 A=vec3(0.0),B=vec3(0.0),Cc=vec3(0.0);
  if(uAOp>0.001) A=sampleShot(uA,uv,uAUV,uAR,uARot,uAOp);
  if(uBOp>0.001) B=sampleShot(uB,uv,uBUV,uBR,uBRot,uBOp);
  if(uCOp>0.001) Cc=sampleShot(uC,uv,uCUV,uCR,uCRot,uCOp);
  vec3 outC;
  if(uT==0){ outC=B; }
  else if(uT==1){ float f=smoothstep(0.0,1.0,uP); outC=mix(vec3(0.0),B,f); }
  else if(uT==2){ float f=uP; float peak=1.0-abs(f-0.5)*2.0; float ov=peak*peak*2.6;
    outC=mix(A,B,smoothstep(0.0,0.55,f)); outC+=vec3(1.0,0.97,0.9)*ov; }
  else if(uT==3){ float mid=step(0.5,uP); vec3 base=mix(A,B,mid);
    float n=hash21(floor(uv*vec2(uRes.y/3.0)),floor(uTime*24.0));
    float band=step(0.5,fract(uv.y*14.0+hash11(floor(uv.y*14.0))*0.3+n));
    float amt=(1.0-abs(uP-0.5)*2.0);
    vec2 off=vec2((n-0.5)*0.14*amt*band,0.0);
    vec3 r=sampleShot(uB,uv+off,uBUV,uBR,uBRot,1.0); vec3 g=sampleShot(uB,uv,uBUV,uBR,uBRot,1.0);
    vec3 b=sampleShot(uB,uv-off*0.7,uBUV,uBR,uBRot,1.0);
    vec3 nb=vec3(r.g,g.g,b.r);
    vec3 q=floor(nb*24.0)/24.0;
    outC=mix(base,nb,amt*0.85); outC=mix(outC,q,amt*0.4); }
  else if(uT==4){ float f=uP; float bands=8.0; float ph=f*3.0;
    float d=uv.x*0.7+uv.y*0.7; float v=fract(d*bands-ph);
    float mask=smoothstep(0.5,0.0,abs(v-0.5));
    float stripeVis=smoothstep(0.35,0.55,f)*smoothstep(0.9,0.6,f);
    vec3 red=vec3(0.843,0.149,0.118), ivory=vec3(0.957,0.937,0.902);
    float isRed=step(0.5,fract(d*bands*0.5-ph));
    vec3 stripeCol=mix(ivory,red,isRed);
    vec3 img=mix(A,B,smoothstep(0.0,0.6,f));
    outC=mix(img,stripeCol,stripeVis*mask); }
  else if(uT==5){ float f=uP; float mid=step(0.5,f); vec3 base=mix(A,B,mid);
    float amt=(1.0-abs(f-0.5)*2.0);
    float off=0.10*amt; vec3 acc=vec3(0.0); float wsum=0.0;
    for(int i=0;i<12;i++){ float fi=float(i); float w=1.0-abs(fi-5.5)/6.0; vec2 o=vec2(off*(fi-5.5)/5.5,0.0);
      acc+=sampleShot(uB,uv+o,uBUV,uBR,uBRot,1.0)*w; wsum+=w; }
    acc/=max(wsum,0.001); outC=mix(base,acc,amt*0.9); }
  else if(uT==6){ float f=uP; float nb=6.0; float bi=floor(uv.x*nb); float bx=fract(uv.x*nb);
    float dirb=mod(bi,2.0); float st=bi/nb;
    float ep=eoe(clamp(f*1.4-st*0.4,0.0,1.0));
    vec3 inc=sampleShot(uB,uv,uBUV,uBR,uBRot,1.0);
    float bandMask=smoothstep(0.0,0.15,ep)*step(bx,ep*1.2);
    outC=mix(A,inc,bandMask); }
  else if(uT==7){ float f=uP; float mid=step(0.5,f); vec3 base=mix(A,B,mid);
    vec2 fc=uBUV; vec2 dir=uv-fc; float amt=(1.0-abs(f-0.5)*2.0);
    vec3 acc=vec3(0.0); float wsum=0.0;
    for(int i=0;i<10;i++){ float fi=float(i); float w=1.0-fi/10.0;
      vec2 o=dir*fi*0.02*amt; acc+=sampleShot(uB,uv+o,uBUV,uBR,uBRot,1.0)*w; wsum+=w; }
    acc/=max(wsum,0.001); outC=mix(base,acc,amt*0.85);
    float ov=1.0+(f<0.5?(0.5-f)*0.6:0.0); outC*=ov; }
  else if(uT==8){ float f=uP; float mid=step(0.5,f);
    float close=smoothstep(0.0,0.5,f); float open=smoothstep(0.5,1.0,f);
    float bar=1.0-abs(uv.y-0.5)*2.0;
    float shut=smoothstep(0.0,0.02,abs(bar-close*0.98));
    vec3 img=mix(A,B,open);
    outC=mix(img,vec3(0.0),shut*smoothstep(0.0,0.5,f));
    outC=mix(vec3(0.0),img,open); }
  else if(uT==9){ float f=uP; float sc=1.18-0.18*eob(f);
    vec2 p=(uv-0.5)/sc+0.5; vec3 inc=sampleShot(uB,p,uBUV,uBR,uBRot,1.0);
    float amt=(1.0-f); vec2 off=vec2(amt*0.02,0.0);
    vec3 r=sampleShot(uB,p+off,uBUV,uBR,uBRot,1.0); vec3 g=inc; vec3 b=sampleShot(uB,p-off,uBUV,uBR,uBRot,1.0);
    vec3 ab=vec3(r.r,g.g,b.b); outC=mix(inc,ab,amt*0.6); }
  else if(uT==10){ float f=uP; float mid=step(0.5,f); vec3 base=mix(A,B,mid);
    float amt=(1.0-abs(f-0.5)*2.0); vec2 dir=uv-0.5;
    vec2 off=dir*amt*0.08;
    vec3 r=sampleShot(uB,uv+off,uBUV,uBR,uBRot,1.0); vec3 g=sampleShot(uB,uv,uBUV,uBR,uBRot,1.0);
    vec3 b=sampleShot(uB,uv-off,uBUV,uBR,uBRot,1.0);
    outC=vec3(r.r,g.g,b.b); }
  else if(uT==11){ float f=uP; float m=smoothstep(0.0,1.0,f);
    float midb=1.0-abs(f-0.5)*2.0; vec3 img=mix(A,B,m); img+=vec3(0.4)*midb*0.3; outC=img; }
  else if(uT==12){ float f=uP; float m=smoothstep(0.0,1.0,f);
    vec3 img=mix(A,B,m);
    float leak=smoothstep(0.0,0.6,f)*smoothstep(1.0,0.4,f);
    vec3 lc=vec3(1.0,0.5,0.2)*exp(-uv.x*2.2)*leak*1.2 + vec3(0.9,0.3,0.1)*exp(-uv.y*1.5)*leak*0.6;
    outC=img+lc; }
  else if(uT==13){ float f=uP; float m=smoothstep(0.0,1.0,f);
    float lumB=dot(sampleShot(uB,uv,uBUV,uBR,uBRot,1.0),vec3(0.299,0.587,0.114));
    float key=smoothstep(0.35,0.85,lumB);
    outC=mix(A,B,mix(m,key,m)); }
  else { outC=B; }
  gl_FragColor=vec4(outC,1.0);
}
`;

const FS_BLOOM=`
precision highp float; varying vec2 vUV; uniform sampler2D uTex; uniform vec2 uRes;
void main(){ vec3 c=texture2D(uTex,vUV).rgb; float l=dot(c,vec3(0.299,0.587,0.114));
  float s=smoothstep(0.55,0.95,l); gl_FragColor=vec4(c*s,1.0); }`;

const FS_DOWN=`
precision highp float; varying vec2 vUV; uniform sampler2D uTex; uniform vec2 uRes;
void main(){ vec3 c=texture2D(uTex,vUV).rgb; gl_FragColor=vec4(c,1.0); }`;

const FS_POST=`
precision highp float; varying vec2 vUV;
uniform sampler2D uScene,uBloom,uText;
uniform vec2 uRes; uniform float uTime; uniform float uFrame;
uniform float uSat,uContrast,uExposure,uCool,uWarm,uCrush,uRed,uScan;
uniform float uLetterbox,uKick,uAspect;
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec3 sCurve(vec3 c){ c=clamp(c,0.0,1.0); c=(c-0.5)*1.12+0.5; return clamp(c,0.0,1.0); }
void main(){
  vec2 uv=vUV;
  float ca=0.0012+uKick*0.004;
  vec2 dir=uv-0.5; float rad=length(dir);
  vec2 off=dir*ca*rad;

let overlayCanvas, octx, behindCanvas, bctx, texBehind=null, shotFBO=[null,null];

const isKW=(w)=>{ const s=w.toLowerCase().replace(/[.,!]/g,''); return KW.some(k=>s.indexOf(k)>=0); };

function fontStack(){
  return {
    mono:(w,s)=>`${w||400} ${s}px 'JetBrains Mono',monospace`,
    inter:(w,s,it)=>`${it?'italic ':''}${w||600} ${s}px 'Inter Tight',sans-serif`,

function renderOverlay(t){
  const o=octx; const w=W,h=H; const minWH=Math.min(w,h);

  const F=fontStack();

function baseHUDOp(mood,kick,t){

function drawHUD(o,w,h,minWH,vertical,t,mood,kick,rms,high,hudOp,F){
  const inset=minWH*0.04;
  const ivory=`rgba(244,239,230,${0.7*hudOp})`;

  const mono=F.mono;

  const corners=[[inset,inset,1,1],[w-inset,inset,-1,1],[inset,h-inset,1,-1],[w-inset,h-inset,-1,-1]];
  for(const [x,y,sx,sy] of corners){
    o.beginPath(); o.moveTo(x,y+sy*bl); o.lineTo(x,y); o.lineTo(x+sx*bl,y); o.stroke();
  }

  o.fillStyle=ivory; o.font=mono(400,fs); o.textBaseline='top';
  o.fillText('POKEE \u25CF ON-PREM', inset*1.3, inset*1.3);
  o.fillStyle=red; o.font=mono(400,fs*0.85);
  o.fillText('NODE-01 \u00B7 SECURE ENCLAVE', inset*1.3, inset*1.3+fs*1.4);
  // top-right timecode
  const tc=timecode(t);
  o.textAlign='right'; o.fillStyle=ivory; o.font=mono(400,fs);
  o.fillText('TC '+tc, w-inset*1.3, inset*1.3);
  o.fillStyle=red; o.font=mono(400,fs*0.85);
  o.fillText('AIR-GAPPED', w-inset*1.3, inset*1.3+fs*1.4);
  o.textAlign='left';
  // bottom-right meters

  o.textAlign='right'; o.fillStyle=ivory; o.font=mono(400,fs*0.9);
  o.fillText('UPLINK: NONE', brx, bry-fs*3.4);
  o.fillText('EGRESS 0.00 KB/S', brx, bry-fs*2.2);
  o.fillText('TENANCY: SINGLE', brx, bry-fs*1.0);
  // 16-bar meter
  const mw=minWH*0.14*1.35, bh=minWH*0.012*1.35, gap=minWH*0.004;
  for(let i=0;i<16;i++){ const x=brx-mw+i*(mw/16)+gap*0.5; const y=bry-fs*0.2;
    const lv=Math.max(rms,high); const on=i/16<lv;

function timecode(t){

function authLines(t,n){

function drawSung(o,w,h,minWH,vertical,t,L,F){

      const e=easeOutExpo(p);

      o.textBaseline='alphabetic';

}
function wrapWords(o,words,maxLines,maxW,F,fs){

function drawChorusSung(o,w,h,minWH,vertical,t,L,F){

function drawTranscript(o,w,h,minWH,vertical,t,L,kind,F){

/* ---------- CHANT (DENIED stamps) ---------- */
function activeChant(t){
  for(let i=0;i<LYRICS.length;i++){ const L=LYRICS[i];if(L.kind==='chant'&&t>=L.start&&t<=L.end){
    const words=L.words||[]; const stamps=[];
    for(const wd of words){ if(t>=wd.s){ stamps.push({t:wd.s,seed:Math.floor(wd.s*1000)}); } }

function drawChant(o,w,h,minWH,vertical,t,F){

  stamps.forEach((s,i)=>{
    const p=clamp((t-s.t)/0.15,0,1); const e=easeOutExpo(p);
    const seed=s.seed+i*31;

    const py=h*(0.15+rand(seed,2)*0.6);
    const rot=(rand(seed,3)-0.5)*0.28; // ±8°

    o.translate(glx,0);

/* ---------- EVENTS ---------- */

    const p=clamp((t-ev.t)/ev.dur,0,1);
    const inP=easeOutExpo(clamp(p/0.25,0,1));
    const outP=clamp((p-0.75)/0.25,0,1);
    const alpha=inP*(1-outP);

    const cx=w/2, cy=h/2;
    switch(ev.type){
      case 'boot': drawBoot(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'speaker': drawSpeaker(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'keycard': drawKeycard(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'denied': drawDenied(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'warn': drawWarn(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'firewall': drawFirewall(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'notify': drawNotify(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'ok': drawOk(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'redact': drawRedact(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'drop': drawDrop(o,w,h,minWH,vertical,t,ev,alpha,F); break;

function initGL(){

    clearTimeout(hideTimer); hideTimer=setTimeout(()=>{ if(playing) ui.classList.add('hidden'); },2500); }

    fill.style.width=pct+'%'; knob.style.left=pct+'%';
    rafId=requestAnimationFrame(tick);

    playing=p;
    if(p){ audio.play().catch(()=>{}); playLbl.textContent='PAUSE'; playBtn.querySelector('.tri').textContent='\u25AE';
      ui.classList.add('hidden'); showUI(); tick(); }
    else { audio.pause(); playLbl.textContent='PLAY'; playBtn.querySelector('.tri').textContent='\u25B6';
      cancelAnimationFrame(rafId); ui.classList.remove('hidden'); }
  }
  playBtn.addEventListener('click',(e)=>{ e.stopPropagation(); setPlay(!playing); });
  scrub.addEventListener('click',(e)=>{
    const r=scrub.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width;

/* ---- subject box in screen pixels for the current shot (inverse of Footage2's camera transform) ---- */
window.subjectScreenBox=function(t){
  const si=shotIndexAt(t); const s=SHOTS[si]; if(!s) return null; const im=IMAGES[s.img];
  if(!im||!im.hasSubject||!im.subject) return null;
  const tr=shotTransform(si,t); let scale=tr.scale, focus=tr.focus, ox=tr.ox, oy=tr.oy;
  if(s.crop){ const c=(sceneH>sceneW)?s.crop.vert:s.crop.land; scale*=c.scale; focus=c.focus; ox+=(focus[0]-0.5)/scale; oy+=(focus[1]-0.5)/scale; }
  const rx=W/im.w, ry=H/im.h, m=Math.max(rx,ry), kx=rx/m, ky=ry/m;
  const toScr=(cx,cy)=>{ const vx=(cx-focus[0]-ox)*scale+focus[0], vy=(cy-focus[1]-oy)*scale+focus[1];
    return [((vx-0.5)/kx+0.5)*W, ((vy-0.5)/ky+0.5)*H]; };
  const b=im.subject.bbox; const p0=toScr(b[0],b[1]), p1=toScr(b[2],b[3]);
  return {x0:Math.max(0,p0[0]),y0:Math.max(0,p0[1]),x1:Math.min(W,p1[0]),y1:Math.min(H,p1[1])};
};

/* ---- 4. baseHUDOp ---- */
baseHUDOp = function(mood,kick,t){
  switch(mood){
    case 'vault':  return 0.75;

/* ---- shared accent + HUD corner brackets ---- */

}
function drawBrackets(o,w,h,ac,op){

/* ---- 5. drawHUD ---- */

/* ---- 7. drawFrameRect (BEHIND canvas) ---- */

/* ---- 9. drawWhisper (FULL-SCREEN WORD SLAM) ---- */

/* ---- 10. drawChant (holographic tags) ---- */

      o.strokeStyle=hexA(C.mag,0.5); o.strokeRect(-bw/2+fs*0.25,-bh/2+fs*0.25,bw-fs*0.5,bh-fs*0.5);
      o.fillStyle=hexA(C.ivory,0.95); o.textAlign='center'; o.textBaseline='middle';
      o.fillText(txt,0,0);
      o.font=F.mono(400,fs*0.5); o.fillStyle=hexA(C.cyan,0.8); o.textAlign='left';
      o.fillText(String(i+1).padStart(2,'0'),-bw/2+fs*0.15,bh/2+fs*0.5);
      o.restore();
    }
  }
};

/* ---- 11. drawEvents (FRONT canvas) ---- */
drawEvents = function(o,w,h,minWH,vertical,t,F){
  if(!o||!F) return;
  if(typeof EVENTS==='undefined') return;
  for(var i=0;i<EVENTS.length;i++){
    var ev=EVENTS[i]; if(!ev) continue;
    var dur=ev.dur||1.0, p=clamp((t-ev.t)/dur,0,1);
    if(p<=0||p>=1) continue;
    var a=p<0.2?easeOutExpo(p/0.2):p>0.8?easeInOutSine(1-(p-0.8)/0.2):1;
    var mood=sectionIndexAt(t); mood=SECTIONS[mood]?SECTIONS[mood].mood:'drop';
    o.save(); o.globalAlpha=a;
    switch(ev.type){
      case 'boot':     drawBoot(o,w,h,minWH,vertical,t,ev,F); break;
      case 'coords':   drawCoords(o,w,h,minWH,vertical,t,ev,F); break;
      case 'scan':     drawScan(o,w,h,minWH,vertical,t,ev,F,mood); break;
      case 'signal':   drawSignal(o,w,h,minWH,vertical,t,ev,F); break;
      case 'upload':   drawUpload(o,w,h,minWH,vertical,t,ev,F); break;
      case 'spectrum': drawSpectrum(o,w,h,minWH,vertical,t,ev,F); break;
      case 'reroute':  drawReroute(o,w,h,minWH,vertical,t,ev,F); break;
      case 'end':      drawEnd(o,w,h,minWH,vertical,t,ev,F); break;
    }
    o.restore();
  }
};

function drawBoot(o,w,h,minWH,vertical,t,ev,F){
  var cx=w/2, cy=h/2, fs=minWH*0.02;
  o.textAlign='center'; o.textBaseline='middle';
  o.font=F.unb(500,fs*1.3); o.fillStyle=hexA(C.cyan,1);
  o.fillText('TRANSMISSION \u00B7 BOOT SEQUENCE',cx,cy-minWH*0.12);
  var lines=['ESTABLISHING LINK\u2026','CARRIER LOCKED 129.2','SUBJECT: UNKNOWN','DESTINATION: \u2014'];
  var start=ev.t, per=0.5, charSp=0.03;
  o.font=F.mono(400,fs);
  for(var i=0;i<lines.length;i++){
    var ly=cy-minWH*0.04+i*fs*1.9, lt=t-(start+0.3+i*per);
    if(lt<=0) continue;
    var n=Math.floor(lt/charSp*20), txt=lines[i].slice(0,n);
    o.textAlign='left'; o.fillStyle=hexA(C.ivory,1);
    o.fillText(txt,cx-minWH*0.16,ly);
    if(n>=lines[i].length){ o.fillStyle=hexA(C.cyan,1); o.fillText('\u2713',cx+minWH*0.16,ly); }
  }
  var prog=clamp((t-start)/Math.max(0.001,(ev.dur||1)),0,1);
  o.strokeStyle=hexA(C.cyan,0.6); o.lineWidth=Math.max(1,minWH*0.002);
  o.beginPath(); o.moveTo(cx-minWH*0.2,cy+minWH*0.12); o.lineTo(cx+minWH*0.2,cy+minWH*0.12); o.stroke();
  o.strokeStyle=hexA(C.mag,1); o.lineWidth=Math.max(1,minWH*0.003);
  o.beginPath(); o.moveTo(cx-minWH*0.2,cy+minWH*0.12); o.lineTo(cx-minWH*0.2+minWH*0.4*prog,cy+minWH*0.12); o.stroke();
}

function drawCoords(o,w,h,minWH,vertical,t,ev,F){
  var x=w*0.95, y=h*0.16, fs=minWH*0.018;
  o.textAlign='right'; o.textBaseline='top';
  var settle=clamp((t-ev.t)/0.8,0,1);
  function sc(base,dec){
    var out=''; for(var i=0;i<base.length;i++){
      if(i<base.length*settle) out+=base[i];
      else if(base[i]===' ') out+=' ';
      else out=String.fromCharCode(48+Math.floor(rand(0.1+i*0.37+t*0.5,0.2+i*0.37+t*0.5)*10));
    } return out;
  }
  o.font=F.mono(700,fs); o.fillStyle=hexA(C.cyan,1); o.fillText('LOST COAST',x,y);
  o.font=F.mono(400,fs); o.fillStyle=hexA(C.ivory,0.9);
  o.fillText(sc('34.0195 N 118.4912 W',4),x,y+fs*1.4);
  o.fillText(sc('ALT 12M',3),x,y+fs*2.8);
  o.fillText(sc('2087.10.21',4),x,y+fs*4.2);
}

function drawScan(o,w,h,minWH,vertical,t,ev,F,mood){
  var box=(typeof window!=='undefined'&&window.subjectScreenBox)?window.subjectScreenBox(t):null;
  if(!box) return;
  var ac=(mood==='chorus')?C.mag:C.cyan;
  var fx=box.x0, fy=box.y0, fw=box.x1-box.x0, fh=(box.y1-box.y0)*0.45;
  var cx=fx+fw/2, cy=fy+fh/2, r=Math.min(fw,fh)*0.6;
  var snap=easeOutBack(clamp((t-ev.t)/0.3,0,1));
  o.save(); o.translate(cx,cy); o.scale(snap,snap); o.translate(-cx,-cy);
  var b=Math.min(fw,fh)*0.14;
  o.strokeStyle=hexA(ac,1); o.lineWidth=Math.max(1,minWH*0.0022);
  o.beginPath();
  o.moveTo(fx,fy+b); o.lineTo(fx,fy); o.lineTo(fx+b,fy);
  o.moveTo(fx+fw-b,fy); o.lineTo(fx+fw,fy); o.lineTo(fx+fw,fy+b);
  o.moveTo(fx+fw,fy+fh-b); o.lineTo(fx+fw,fy+fh); o.lineTo(fx+fw-b,fy+fh);
  o.moveTo(fx+b,fy+fh); o.lineTo(fx,fy+fh); o.lineTo(fx,fy+fh-b);
  o.stroke();
  o.strokeStyle=hexA(ac,0.7); o.beginPath();
  o.moveTo(cx-r*0.3,cy); o.lineTo(cx+r*0.3,cy); o.moveTo(cx,cy-r*0.3); o.lineTo(cx,cy+r*0.3); o.stroke();
  o.setLineDash([minWH*0.008,minWH*0.008]); o.lineDashOffset=-t*minWH*0.05;
  o.strokeStyle=hexA(ac,0.8); o.beginPath(); o.arc(cx,cy,r,0,Math.PI*2); o.stroke(); o.setLineDash([]);
  var match=clamp((t-ev.t)/1.2,0,1)*99.4;
  o.font=F.mono(700,minWH*0.016); o.textAlign='left'; o.textBaseline='middle';
  o.fillStyle=hexA(ac,1); o.fillText('SUBJECT \u25CE 0x7F3A',fx,fy-minWH*0.03);
  o.font=F.mono(400,minWH*0.014); o.fillStyle=hexA(C.ivory,0.9);
  o.fillText('MATCH '+match.toFixed(1)+'%',fx,fy+fh+minWH*0.02);
  for(var c=0;c<3;c++){
    var dx=fx+fw+minWH*0.02+c*minWH*0.012, col='';
    for(var rr=0;rr<10;rr++) col+=String.fromCharCode(48+Math.floor(rand(0.2+c*0.3+rr*0.7+t*0.4,0.3+c*0.3+rr*0.7+t*0.4)*10));
    o.fillStyle=hexA(ac,0.6); o.fillText(col,dx,fy+rr*minWH*0.014);
  }
  o.restore();
}

function drawSignal(o,w,h,minWH,vertical,t,ev,F){
  var lost=(ev.text&&ev.text.indexOf('LOST')>=0);
  var col=lost?C.red:C.cyan, cy=h/2, fs=minWH*0.06;
  var g=floor24(t);
  o.save();
  o.fillStyle=hexA(col,0.12); o.fillRect(0,cy-minWH*0.06,w,minWH*0.12);
  o.font=F.unb(700,fs); o.textAlign='center'; o.textBaseline='middle';
  var off=minWH*0.012;
  o.fillStyle=hexA(C.mag,0.7); o.fillText(ev.text,w/2-off,cy);
  o.fillStyle=hexA(C.cyan,0.7); o.fillText(ev.text,w/2+off,cy);
  o.fillStyle=hexA(col,1); o.fillText(ev.text,w/2,cy);
  for(var s=0;s<5;s++){
    var sy=cy+rand(0.1+s*0.41,0.2+s*0.41)*minWH*0.12-minWH*0.06, sh=minWH*0.008;
    var dx=(rand(0.3+s*0.27,0.4+s*0.27)-0.5)*minWH*0.1;
    o.fillStyle=hexA(col,0.5); o.fillRect(w*0.2+dx,sy,w*0.6,sh);
  }
  o.restore();
}

function drawUpload(o,w,h,minWH,vertical,t,ev,F){
  var cx=w/2, cy=h/2, bw=minWH*0.5, bh=minWH*0.02;
  o.textAlign='center'; o.textBaseline='middle';
  o.font=F.unb(500,minWH*0.022); o.fillStyle=hexA(C.ivory,1);
  o.fillText('UPLOADING CONSCIOUSNESS',cx,cy-minWH*0.05);
  var p=clamp((t-ev.t)/Math.max(0.001,ev.dur),0,1);
  var q=Math.floor(p*12)/12, eased=easeInOutCubic(q);
  var pct=Math.round(eased*100);
  var cells=40, cw=bw/cells, filled=Math.floor(eased*cells);
  for(var i=0;i<cells;i++){
    o.fillStyle=i<filled?hexA(C.cyan,0.9):hexA(C.cyan,0.15);
    o.fillRect(cx-bw/2+i*cw+1,cy,cw-2,bh);
  }
  o.strokeStyle=hexA(C.mag,0.6); o.lineWidth=1; o.strokeRect(cx-bw/2,cy,bw,bh);
  o.font=F.mono(700,minWH*0.03); o.fillStyle=hexA(C.cyan,1);
  o.fillText(pct+'%',cx,cy+bh*1.6);
  o.font=F.mono(400,minWH*0.014); o.fillStyle=hexA(C.ivory,0.7);
  o.fillText('THRU '+(2.4+eased*12.6).toFixed(1)+' GB/s \u00B7 NODE TOKYO-7',cx,cy+bh*3);
}

function drawSpectrum(o,w,h,minWH,vertical,t,ev,F){
  var cx=w/2, cy=h/2, R=minWH*0.28, bars=64;
  var low=(typeof envVal==='function'&&ENV)?envVal(ENV.low,t):0.3,
      mid=(typeof envVal==='function'&&ENV)?envVal(ENV.rms,t):0.3,
      hi=(typeof envVal==='function'&&ENV)?envVal(ENV.high,t):0.3;
  o.save(); o.globalAlpha=0.6;
  for(var i=0;i<bars;i++){
    var ang=(i/bars)*Math.PI*2-Math.PI/2, shape=0.3+0.7*rand(0.2+i*0.31,0.3+i*0.31);
    var env=i<22?low:(i<44?mid:hi), v=clamp(env*shape,0,1), len=R*0.1+R*0.5*v;
    var x1=cx+Math.cos(ang)*R, y1=cy+Math.sin(ang)*R, x2=cx+Math.cos(ang)*(R+len), y2=cy+Math.sin(ang)*(R+len);
    o.strokeStyle=i%2?hexA(C.cyan,0.7):hexA(C.mag,0.7); o.lineWidth=Math.max(1,minWH*0.003);
    o.beginPath(); o.moveTo(x1,y1); o.lineTo(x2,y2); o.stroke();
  }
  o.strokeStyle=hexA(C.cyan,0.4); o.lineWidth=1; o.beginPath(); o.arc(cx,cy,R,0,Math.PI*2); o.stroke();
  o.restore();
}

function drawReroute(o,w,h,minWH,vertical,t,ev,F){
  var cx=w/2, y=h*0.08, fs=minWH*0.02, txt=ev.text||'REROUTING';
  o.font=F.mono(700,fs); o.textAlign='center'; o.textBaseline='middle';
  var tw=o.measureText(txt).width, cw=tw+fs*3, chh=fs*2.2;
  o.fillStyle=hexA(C.amber,0.15); o.fillRect(cx-cw/2,y-chh/2,cw,chh);
  o.strokeStyle=hexA(C.amber,0.9); o.lineWidth=Math.max(1,minWH*0.002); o.strokeRect(cx-cw/2,y-chh/2,cw,chh);
  o.fillStyle=hexA(C.amber,1); o.fillText('\u26A0 '+txt,cx+fs*0.3,y);
  if(Math.floor(t*4)%2===0){ o.beginPath(); o.arc(cx-cw/2+fs*0.6,y,fs*0.3,0,Math.PI*2); o.fill(); }
}

function drawEnd(o,w,h,minWH,vertical,t,ev,F){
  var cx=w/2, cy=h/2;
  var fadeOut=clamp((DUR-t)/0.8,0,1);
  o.save(); o.globalAlpha*=fadeOut;
  o.fillStyle='rgba(5,6,15,0.85)'; o.fillRect(0,0,w,h);
  var fs=minWH*0.14, fit=fitFont(o,["GOING HARD"],fs,w*0.9,function(s){return F.unb(900,s);});
  o.textAlign='center'; o.textBaseline='middle';
  o.font=F.unb(900,fs*fit);
  var settle=clamp((t-ev.t)/0.6,0,1), off=(1-settle)*minWH*0.02;
  o.fillStyle=hexA(C.mag,0.8); o.fillText('GOING HARD',cx-off,cy-minWH*0.06);
  o.fillStyle=hexA(C.cyan,0.8); o.fillText('GOING HARD',cx+off,cy-minWH*0.06);
  o.fillStyle=hexA(C.ivory,1); o.fillText('GOING HARD',cx,cy-minWH*0.06);
  o.font=F.bodoni(400,minWH*0.03,true); o.fillStyle=hexA(C.ivory,0.9);
  o.fillText('A TRANSMISSION IN EIGHT PARTS',cx,cy+minWH*0.06);
  o.strokeStyle=hexA(C.cyan,0.8); o.lineWidth=Math.max(1,minWH*0.002);
  o.beginPath(); o.moveTo(cx-minWH*0.15,cy+minWH*0.1); o.lineTo(cx+minWH*0.15,cy+minWH*0.1); o.stroke();
  o.restore();
}

/* ---- small helper ---- */
function floor24(t){ return Math.floor(t*24); }

})();

init();
})();
</script>
