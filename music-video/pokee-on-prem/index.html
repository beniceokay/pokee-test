<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POKEE — ON-PREM</title>
<style>
  :root{
    --red:#E1251B; --red2:#D7261E; --ivory:#F4EFE6; --mid:#0B0F1A;
    --green:#3BE28A; --amber:#FFB020;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#05070d;overflow:hidden;font-family:'Inter Tight',sans-serif}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  .hidden{display:none !important}
  #play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    pointer-events:auto;cursor:pointer;color:var(--ivory);
    font-family:'Inter Tight',sans-serif;font-weight:900;letter-spacing:.35em;
    font-size:clamp(14px,1.6vw,20px);display:flex;align-items:center;gap:.7em;
    padding:1.1em 1.6em;border:1px solid rgba(244,239,230,.55);
    background:rgba(11,15,26,.55);backdrop-filter:blur(6px);
    transition:all .35s cubic-bezier(.16,1,.3,1);user-select:none}
  #play:hover{background:rgba(225,37,27,.85);border-color:var(--red);letter-spacing:.45em}
  #play .tri{font-size:.8em;transform:translateY(-1px)}
  #play .brand{position:absolute;top:-1.9em;left:50%;transform:translateX(-50%);
    font-weight:600;font-size:.62em;letter-spacing:.5em;opacity:.7;white-space:nowrap}
  #scrub{position:absolute;left:0;right:0;bottom:0;height:26px;pointer-events:auto;cursor:pointer}
  #scrubTrack{position:absolute;left:0;right:0;bottom:11px;height:3px;background:rgba(244,239,230,.18)}
  #scrubFill{position:absolute;left:0;bottom:11px;height:3px;width:0;background:var(--red);box-shadow:0 0 8px rgba(225,37,27,.8)}
  #scrubKnob{position:absolute;bottom:6px;width:13px;height:13px;border-radius:50%;background:var(--ivory);
    transform:translateX(-50%);box-shadow:0 0 10px rgba(244,239,230,.6);opacity:0;transition:opacity .3s}
  #scrub:hover #scrubKnob{opacity:1}
  #hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);color:rgba(244,239,230,.5);
    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;pointer-events:none}
  #ready{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--ivory);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.3em;
    background:#05070d;z-index:20;transition:opacity .6s}
  #ready .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);
    margin-right:12px;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}
  @media (max-width:640px){#play{font-size:13px;letter-spacing:.28em}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui" class="hidden">
  <div id="play"><span class="brand">POKEE — ON-PREM</span><span class="tri">▶</span><span id="playLbl">PLAY</span></div>
  <div id="scrub"><div id="scrubTrack"></div><div id="scrubFill"></div><div id="scrubKnob"></div></div>
  <div id="hint">SPACE — PLAY/PAUSE · CLICK SCRUBBER TO SEEK</div>
</div>
<div id="ready"><span class="dot"></span>PREPARING SECURE ENCLAVE…</div>

<script src="timeline.js"></script>
<script>
(function(){
"use strict";
/* ============================================================
   POKEE — ON-PREM  |  deterministic real-time WebGL render engine
   ============================================================ */

/* ---------- palette ---------- */
const C={
  red:[0.882,0.145,0.106], red2:[0.843,0.149,0.118],
  ivory:[0.957,0.937,0.902], mid:[0.043,0.059,0.102],
  green:[0.231,0.886,0.541], amber:[1.0,0.690,0.125]
};

/* ---------- deterministic RNG (pure) ---------- */
function h2(a,b){ let h=(a*374761393 + b*668265263)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967295; }
function rand(a,b){ return h2((a|0)+1,(b|0)+1); }
function h1(a){ let h=(a*2654435761)|0; h=(h^(h>>>16))*2246822519|0; return ((h^(h>>>13))>>>0)/4294967295; }

/* ---------- easing ---------- */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOutExpo=t=>t>=1?1:1-Math.pow(2,-10*t);
const easeInOutCubic=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeInOutSine=t=>-(Math.cos(Math.PI*t)-1)/2;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeOutQuint=t=>1-Math.pow(1-t,5);

/* ---------- timeline refs ---------- */
const TL=window.TIMELINE||{duration:243.19,fps_env:30,tempo:143.55,beats:[],downbeats:[],kicks:[],
  sections:[],shots:[],lyrics:[],events:[],images:[],env:{rms:[],low:[],high:[]}};
const DUR=TL.duration||243.19;
const FPS=TL.fps_env||30;
const BEATS=TL.beats||[], DOWNS=TL.downbeats||[], KICKS=TL.kicks||[];
const SECTIONS=TL.sections||[], SHOTS=TL.shots||[], LYRICS=TL.lyrics||[], EVENTS=TL.events||[],
      IMAGES=TL.images||[], ENV=TL.env||{rms:[],low:[],high:[]};
const NUMSHOTS=SHOTS.length, NUMIMG=IMAGES.length;

/* ---------- binary search helpers ---------- */
function lowerBound(arr,t){ let lo=0,hi=arr.length; while(lo<hi){const m=(lo+hi)>>1; if(arr[m]<t)lo=m+1; else hi=m;} return lo; }
function upperBound(arr,t){ let lo=0,hi=arr.length; while(lo<hi){const m=(lo+hi)>>1; if(arr[m]<=t)lo=m+1; else hi=m;} return lo; }
function shotIndexAt(t){
  if(!SHOTS.length) return 0;
  t=clamp(t,0,DUR);
  let lo=0,hi=SHOTS.length-1,ans=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(SHOTS[m].start<=t){ans=m;lo=m+1;} else hi=m-1;}
  return ans;
}
function sectionIndexAt(t){
  if(!SECTIONS.length) return 0;
  t=clamp(t,0,DUR);
  let lo=0,hi=SECTIONS.length-1,ans=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(SECTIONS[m].start<=t){ans=m;lo=m+1;} else hi=m-1;}
  return ans;
}
function envVal(arr,t){
  if(!arr||arr.length<2) return 0;
  const f=clamp(t*FPS,0,arr.length-1);
  const i=Math.floor(f), fr=f-i, a=arr[i]||0, b=arr[Math.min(i+1,arr.length-1)]||0;
  return lerp(a,b,fr)/255;
}
function nearest(arr,t){ if(!arr.length)return t; let lo=0,hi=arr.length-1; if(t<=arr[0])return arr[0]; if(t>=arr[hi])return arr[hi];
  while(lo<=hi){const m=(lo+hi)>>1; if(arr[m]<=t&&arr[m+1]>t){return (t-arr[m])<(arr[m+1]-t)?arr[m]:arr[m+1];} if(arr[m]<t)lo=m+1; else hi=m-1;} return arr[hi]; }

/* ---------- shot / camera model ---------- */
function shotTransform(idx,t){
  const s=SHOTS[idx]; const dur=Math.max(0.0001,s.end-s.start);
  const p=clamp((t-s.start)/dur,0,1);
  const e=easeInOutSine(p);
  const mv=s.move||'pushin';
  let scale=1.08, ox=0, oy=0;
  if(mv==='pushin'){ scale=lerp(1.08,1.18,e); }
  else if(mv==='pullout'){ scale=lerp(1.20,1.08,e); }
  else if(mv==='panleft'){ scale=1.10; ox=lerp(0.05,-0.05,e); }
  else if(mv==='panright'){ scale=1.10; ox=lerp(-0.05,0.05,e); }
  else if(mv==='tiltup'){ scale=1.10; oy=lerp(0.05,-0.05,e); }
  else if(mv==='tiltdown'){ scale=1.10; oy=lerp(-0.05,0.05,e); }
  else if(mv==='punch'){ scale=lerp(1.08,1.18,e); }
  else { scale=1.08+0.05*Math.sin(e*Math.PI); }
  return {scale,ox,oy,focus:s.focus||[0.5,0.5],img:s.img};
}
function punchBump(t){
  let best=-1;
  for(let i=KICKS.length-1;i>=0;i--){ const k=KICKS[i]; if(k<=t){ best=k; break; } }
  if(best<0) return 0;
  const dt=t-best; if(dt>0.15) return 0;
  return 1.015*Math.exp(-dt/0.05);
}
function downPulse(t,mood){
  if(mood!=='chorus') return 1;
  let best=-1; for(let i=DOWNS.length-1;i>=0;i--){ if(DOWNS[i]<=t){best=DOWNS[i];break;} }
  if(best<0) return 1; const dt=t-best; if(dt>0.12) return 1;
  return 1+0.006*Math.exp(-dt/0.04);
}

/* ---------- mood grade ---------- */
function moodParams(mood){
  switch(mood){
    case 'vault':   return {sat:0.72,contrast:1.06,exposure:0.95,cool:0.30,warm:0.0,crush:0.30,letterbox:1.0,red:0.0,scan:0.0};
    case 'bridge':  return {sat:0.74,contrast:1.04,exposure:0.96,cool:0.24,warm:0.02,crush:0.26,letterbox:1.0,red:0.0,scan:0.0};
    case 'drop':    return {sat:1.28,contrast:1.18,exposure:1.06,cool:-0.05,warm:0.12,crush:0.0,letterbox:0.0,red:0.10,scan:0.0};
    case 'chorus':  return {sat:1.24,contrast:1.16,exposure:1.05,cool:-0.04,warm:0.10,crush:0.0,letterbox:0.0,red:0.12,scan:0.0};
    case 'verse':   return {sat:1.02,contrast:1.05,exposure:1.0,cool:0.02,warm:0.03,crush:0.0,letterbox:0.0,red:0.0,scan:0.0};
    case 'build':   return {sat:1.08,contrast:1.10,exposure:1.02,cool:0.05,warm:0.05,crush:0.0,letterbox:0.0,red:0.04,scan:0.0};
    case 'denied':  return {sat:0.70,contrast:1.10,exposure:0.98,cool:0.0,warm:0.0,crush:0.05,letterbox:0.0,red:0.55,scan:0.5};
    case 'outro':   return {sat:0.82,contrast:0.98,exposure:0.90,cool:0.06,warm:0.16,crush:0.10,letterbox:0.0,red:0.0,scan:0.0};
    default:        return {sat:1.0,contrast:1.05,exposure:1.0,cool:0.0,warm:0.0,crush:0.0,letterbox:0.0,red:0.0,scan:0.0};
  }
}
function gradeAt(t){
  const si=sectionIndexAt(t); const sec=SECTIONS[si]||{mood:'verse',start:0};
  const cur=moodParams(sec.mood);
  let prev=moodParams(sec.mood);
  if(si>0){ const p=SECTIONS[si-1]; prev=moodParams(p.mood); const b=sec.start;
    const x=clamp((t-b)/0.5,0,1);
    for(const k in cur) cur[k]=lerp(prev[k],cur[k],x);
  }
  return {params:cur,mood:sec.mood,sec:sec};
}

/* ---------- transition durations ---------- */
const TDUR={cut:0,fadein:2.0,flash:0.28,glitch:0.32,stripe:0.5,whip:0.36,slice:0.42,zoom:0.4,shutter:0.3,punch:0.22,rgb:0.32,dissolve:1.2,lightleak:1.4,lumafade:1.8};
const TID={cut:0,fadein:1,flash:2,glitch:3,stripe:4,whip:5,slice:6,zoom:7,shutter:8,punch:9,rgb:10,dissolve:11,lightleak:12,lumafade:13};

/* ============================================================
   WEBGL
   ============================================================ */
const canvas=document.getElementById('gl');
let gl=null, glOK=false;
let progMain, progBloom, progDown, progPost;
let quadBuf;
let texA=null, texB=null, texC=null, texText=null, bloomTex=null;
let bloomW=0, bloomH=0;
let W=0,H=0,dpr=1;

const VS=`attribute vec2 aPos; varying vec2 vUV; void main(){ vUV=aPos*0.5+0.5; gl_Position=vec4(aPos,0.0,1.0); }`;

const FS_MAIN2=`
precision highp float;
varying vec2 vUV;
uniform sampler2D uA,uB,uC;
uniform vec2 uAUV,uBUV,uCUV;
uniform vec2 uAR,uBR,uCR;
uniform float uARot,uBRot,uCRot;
uniform float uAOp,uBOp,uCOp;
uniform int uT; uniform float uP;
uniform vec2 uRes;
uniform float uTime;
float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }
float hash21(vec2 p, float t){ p=fract(p*vec2(123.34,456.21)+t*0.31); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec2 rot(vec2 uv,float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c)*(uv-0.5)+0.5; }
float eoe(float t){ return t>=1.0?1.0:1.0-pow(2.0,-10.0*t); }
float eob(float t){ float c1=1.70158,c3=c1+1.0; return 1.0+c3*pow(t-1.0,3.0)+c1*pow(t-1.0,2.0); }
vec3 sampleShot(sampler2D tx, vec2 uv, vec2 uvC, vec2 r, float ro, float op){
  vec2 p=(uv-uvC)/r; p=rot(p,ro); vec2 s=uvC+r*0.5*p;
  vec3 col=texture2D(tx,s).rgb; return col*op;
}
void main(){
  vec2 uv=vUV; vec3 A=vec3(0.0),B=vec3(0.0),Cc=vec3(0.0);
  if(uAOp>0.001) A=sampleShot(uA,uv,uAUV,uAR,uARot,uAOp);
  if(uBOp>0.001) B=sampleShot(uB,uv,uBUV,uBR,uBRot,uBOp);
  if(uCOp>0.001) Cc=sampleShot(uC,uv,uCUV,uCR,uCRot,uCOp);
  vec3 outC;
  if(uT==0){ outC=B; }
  else if(uT==1){ float f=smoothstep(0.0,1.0,uP); outC=mix(vec3(0.0),B,f); }
  else if(uT==2){ float f=uP; float peak=1.0-abs(f-0.5)*2.0; float ov=peak*peak*2.6;
    outC=mix(A,B,smoothstep(0.0,0.55,f)); outC+=vec3(1.0,0.97,0.9)*ov; }
  else if(uT==3){ float mid=step(0.5,uP); vec3 base=mix(A,B,mid);
    float n=hash21(floor(uv*vec2(uRes.y/3.0)),floor(uTime*24.0));
    float band=step(0.5,fract(uv.y*14.0+hash11(floor(uv.y*14.0))*0.3+n));
    float amt=(1.0-abs(uP-0.5)*2.0);
    vec2 off=vec2((n-0.5)*0.14*amt*band,0.0);
    vec3 r=sampleShot(uB,uv+off,uBUV,uBR,uBRot,1.0); vec3 g=sampleShot(uB,uv,uBUV,uBR,uBRot,1.0);
    vec3 b=sampleShot(uB,uv-off*0.7,uBUV,uBR,uBRot,1.0);
    vec3 nb=vec3(r.g,g.g,b.r);
    vec3 q=floor(nb*24.0)/24.0;
    outC=mix(base,nb,amt*0.85); outC=mix(outC,q,amt*0.4); }
  else if(uT==4){ float f=uP; float bands=8.0; float ph=f*3.0;
    float d=uv.x*0.7+uv.y*0.7; float v=fract(d*bands-ph);
    float mask=smoothstep(0.5,0.0,abs(v-0.5));
    float stripeVis=smoothstep(0.35,0.55,f)*smoothstep(0.9,0.6,f);
    vec3 red=vec3(0.843,0.149,0.118), ivory=vec3(0.957,0.937,0.902);
    float isRed=step(0.5,fract(d*bands*0.5-ph));
    vec3 stripeCol=mix(ivory,red,isRed);
    vec3 img=mix(A,B,smoothstep(0.0,0.6,f));
    outC=mix(img,stripeCol,stripeVis*mask); }
  else if(uT==5){ float f=uP; float mid=step(0.5,f); vec3 base=mix(A,B,mid);
    float amt=(1.0-abs(f-0.5)*2.0);
    float off=0.10*amt; vec3 acc=vec3(0.0); float wsum=0.0;
    for(int i=0;i<12;i++){ float fi=float(i); float w=1.0-abs(fi-5.5)/6.0; vec2 o=vec2(off*(fi-5.5)/5.5,0.0);
      acc+=sampleShot(uB,uv+o,uBUV,uBR,uBRot,1.0)*w; wsum+=w; }
    acc/=max(wsum,0.001); outC=mix(base,acc,amt*0.9); }
  else if(uT==6){ float f=uP; float nb=6.0; float bi=floor(uv.x*nb); float bx=fract(uv.x*nb);
    float dirb=mod(bi,2.0); float st=bi/nb;
    float ep=eoe(clamp(f*1.4-st*0.4,0.0,1.0));
    vec3 inc=sampleShot(uB,uv,uBUV,uBR,uBRot,1.0);
    float bandMask=smoothstep(0.0,0.15,ep)*step(bx,ep*1.2);
    outC=mix(A,inc,bandMask); }
  else if(uT==7){ float f=uP; float mid=step(0.5,f); vec3 base=mix(A,B,mid);
    vec2 fc=uBUV; vec2 dir=uv-fc; float amt=(1.0-abs(f-0.5)*2.0);
    vec3 acc=vec3(0.0); float wsum=0.0;
    for(int i=0;i<10;i++){ float fi=float(i); float w=1.0-fi/10.0;
      vec2 o=dir*fi*0.02*amt; acc+=sampleShot(uB,uv+o,uBUV,uBR,uBRot,1.0)*w; wsum+=w; }
    acc/=max(wsum,0.001); outC=mix(base,acc,amt*0.85);
    float ov=1.0+(f<0.5?(0.5-f)*0.6:0.0); outC*=ov; }
  else if(uT==8){ float f=uP; float mid=step(0.5,f);
    float close=smoothstep(0.0,0.5,f); float open=smoothstep(0.5,1.0,f);
    float bar=1.0-abs(uv.y-0.5)*2.0;
    float shut=smoothstep(0.0,0.02,abs(bar-close*0.98));
    vec3 img=mix(A,B,open);
    outC=mix(img,vec3(0.0),shut*smoothstep(0.0,0.5,f));
    outC=mix(vec3(0.0),img,open); }
  else if(uT==9){ float f=uP; float sc=1.18-0.18*eob(f);
    vec2 p=(uv-0.5)/sc+0.5; vec3 inc=sampleShot(uB,p,uBUV,uBR,uBRot,1.0);
    float amt=(1.0-f); vec2 off=vec2(amt*0.02,0.0);
    vec3 r=sampleShot(uB,p+off,uBUV,uBR,uBRot,1.0); vec3 g=inc; vec3 b=sampleShot(uB,p-off,uBUV,uBR,uBRot,1.0);
    vec3 ab=vec3(r.r,g.g,b.b); outC=mix(inc,ab,amt*0.6); }
  else if(uT==10){ float f=uP; float mid=step(0.5,f); vec3 base=mix(A,B,mid);
    float amt=(1.0-abs(f-0.5)*2.0); vec2 dir=uv-0.5;
    vec2 off=dir*amt*0.08;
    vec3 r=sampleShot(uB,uv+off,uBUV,uBR,uBRot,1.0); vec3 g=sampleShot(uB,uv,uBUV,uBR,uBRot,1.0);
    vec3 b=sampleShot(uB,uv-off,uBUV,uBR,uBRot,1.0);
    outC=vec3(r.r,g.g,b.b); }
  else if(uT==11){ float f=uP; float m=smoothstep(0.0,1.0,f);
    float midb=1.0-abs(f-0.5)*2.0; vec3 img=mix(A,B,m); img+=vec3(0.4)*midb*0.3; outC=img; }
  else if(uT==12){ float f=uP; float m=smoothstep(0.0,1.0,f);
    vec3 img=mix(A,B,m);
    float leak=smoothstep(0.0,0.6,f)*smoothstep(1.0,0.4,f);
    vec3 lc=vec3(1.0,0.5,0.2)*exp(-uv.x*2.2)*leak*1.2 + vec3(0.9,0.3,0.1)*exp(-uv.y*1.5)*leak*0.6;
    outC=img+lc; }
  else if(uT==13){ float f=uP; float m=smoothstep(0.0,1.0,f);
    float lumB=dot(sampleShot(uB,uv,uBUV,uBR,uBRot,1.0),vec3(0.299,0.587,0.114));
    float key=smoothstep(0.35,0.85,lumB);
    outC=mix(A,B,mix(m,key,m)); }
  else { outC=B; }
  gl_FragColor=vec4(outC,1.0);
}
`;

const FS_BLOOM=`
precision highp float; varying vec2 vUV; uniform sampler2D uTex; uniform vec2 uRes;
void main(){ vec3 c=texture2D(uTex,vUV).rgb; float l=dot(c,vec3(0.299,0.587,0.114));
  float s=smoothstep(0.55,0.95,l); gl_FragColor=vec4(c*s,1.0); }`;

const FS_DOWN=`
precision highp float; varying vec2 vUV; uniform sampler2D uTex; uniform vec2 uRes;
void main(){ vec3 c=texture2D(uTex,vUV).rgb; gl_FragColor=vec4(c,1.0); }`;

const FS_POST=`
precision highp float; varying vec2 vUV;
uniform sampler2D uScene,uBloom,uText;
uniform vec2 uRes; uniform float uTime; uniform float uFrame;
uniform float uSat,uContrast,uExposure,uCool,uWarm,uCrush,uRed,uScan;
uniform float uLetterbox,uKick,uAspect;
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec3 sCurve(vec3 c){ c=clamp(c,0.0,1.0); c=(c-0.5)*1.12+0.5; return clamp(c,0.0,1.0); }
void main(){
  vec2 uv=vUV;
  float ca=0.0012+uKick*0.004;
  vec2 dir=uv-0.5; float rad=length(dir);
  vec2 off=dir*ca*rad;
  float r=texture2D(uScene,uv+off).r; float g=texture2D(uScene,uv).g; float b=texture2D(uScene,uv-off).b;
  vec3 col=vec3(r,g,b);
  col*=uExposure;
  col=sCurve(col);
  col=(col-0.5)*uContrast+0.5;
  // cool/warm tint
  col.r+=uWarm*0.05; col.b+=uCool*0.05;
  // saturation
  float lum=dot(col,vec3(0.299,0.587,0.114));

  col=col*(1.0-uCrush)+vec3(0.02,0.05,0.07)*uCrush*(1.0-lum);

  col=mix(col,vec3(col.r*1.15,col.g*0.7,col.b*0.7),uRed);
  // bloom
  vec3 bl=texture2D(uBloom,uv).rgb;

  float vig=1.0-smoothstep(0.5,1.15,rad*1.3);

  float lb=uLetterbox*0.11;
  float top=smoothstep(lb+0.002,lb-0.002,uv.y);
  float bot=smoothstep(1.0-lb-0.002,1.0-lb+0.002,uv.y);

  float g1=hash12(uv*uRes*0.5+vec2(uFrame*13.7,uFrame*7.3));

function compile(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s),src); return s; }
function program(vs,fs){ const p=gl.createProgram(); gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const info=gl.getActiveUniform(p,i); u[info.name]=gl.getUniformLocation(p,info.name); }
  return {p,u}; }

function makeTex(w,h){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t; }
function makeFBO(w,h){ const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  const t=makeTex(w,h); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  return {f,t,w,h}; }

/* ---------- texture LRU (<=6) ---------- */
const MAXTEX=6;
const texLRU=new Map(); // imgIndex -> {tex, last}
let texOrder=[];
function getShotTexture(imgIdx){
  if(imgIdx==null||imgIdx<0||imgIdx>=NUMIMG) return null;
  if(texLRU.has(imgIdx)){ const e=texLRU.get(imgIdx); e.last=performance.now();
    texOrder=texOrder.filter(x=>x!==imgIdx); texOrder.push(imgIdx); return e.tex; }
  if(texLRU.size>=MAXTEX){ const old=texOrder.shift(); const oe=texLRU.get(old);
    if(oe){ gl.deleteTexture(oe.tex); } texLRU.delete(old); }
  const img=IMAGES[imgIdx]; let tex=null;
  if(img && img._el && img._el.complete){
    gl.activeTexture(gl.TEXTURE5); tex=makeTex(2048,2048); gl.bindTexture(gl.TEXTURE_2D,tex);
    try{ gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img._el); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false); }
    catch(e){ gl.deleteTexture(tex); tex=null; }
  }
  texLRU.set(imgIdx,{tex,last:performance.now()}); texOrder.push(imgIdx);
  return tex;
}

/* ---------- render pipeline ---------- */
function drawQuad(){ gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
  const loc=gl.getAttribLocation(glProgram,'aPos');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); }
let glProgram=null;

function setShotUniforms(P,shot,t,isB){
  const tr=shotTransform(shot.idx,t);
  const img=IMAGES[tr.img];
  const iw=img?img.w:2560, ih=img?img.h:1433;
  const aspect=W/H, iaspect=iw/ih;
  let rs,cs;
  if(aspect>iaspect){ cs=tr.scale; rs=tr.scale*aspect/iaspect; }
  else { rs=tr.scale; cs=tr.scale*iaspect/aspect; }
  const fx=tr.focus[0], fy=tr.focus[1];
  const cx=0.5+(0.5-fx)*cs+tr.ox;
  const cy=0.5+(fy-0.5)*cs-tr.oy;
  const tex=getShotTexture(tr.img);
  const u=P.u;
  const pre=isB?'uB':'uA';
  gl.uniform1i(u[pre+'Tex']||u[isB?'uB':'uA'],0); // placeholder
  return {tex,cx,cy,cs,rs};
}

function renderFrame(t){
  if(!glOK) return;
  t=clamp(t,0,DUR);
  const frame=Math.floor(t*24);
  const g=gradeAt(t);
  const kick=envVal(ENV.low,t);
  const si=shotIndexAt(t);
  const shot=SHOTS[si];
  const dur=Math.max(0.001,shot.end-shot.start);

  // determine transition window
  const tr=shot.transition||'cut';
  const d=TDUR[tr]||0;
  const inWin = t>=shot.start-d/2 && t<=shot.start+d/2;
  const prevIdx = si>0 ? si-1 : -1;

  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFBO.f);
  gl.viewport(0,0,sceneW,sceneH);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);

  gl.useProgram(progMain.p); glProgram=progMain.p;
  const u=progMain.u;
  gl.uniform2f(u.uRes,sceneW,sceneH);
  gl.uniform1f(u.uTime,t);

  // shot A (outgoing)
  let aOp=0,bOp=0,cOp=0;
  if(prevIdx>=0){
    const pa=shotTransform(prevIdx,t);
    const ima=IMAGES[pa.img]; const iwa=ima?ima.w:2560, iha=ima?ima.h:1433;
    const aspect=W/H, ias=iwa/iha; let rsa,csa;
    if(aspect>ias){csa=pa.scale;rsa=pa.scale*aspect/ias;} else {rsa=pa.scale;csa=pa.scale*ias/aspect;}
    const texA=getShotTexture(pa.img);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texA||blackTex);
    gl.uniform1i(u.uA,0);
    gl.uniform2f(u.uAUV,0.5+(0.5-pa.focus[0])*csa+pa.ox,0.5+(pa.focus[1]-0.5)*csa-pa.oy);
    gl.uniform2f(u.uAR,csa,rsa); gl.uniform1f(u.uARot,0);
  } else { gl.uniform1i(u.uA,0); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,blackTex); }

  // shot B (incoming / current)
  const pb=shotTransform(si,t);
  const imb=IMAGES[pb.img]; const iwb=imb?imb.w:2560, ihb=imb?imb.h:1433;
  const aspect=W/H, iasb=iwb/ihb; let rsb,csb;
  if(aspect>iasb){csb=pb.scale;rsb=pb.scale*aspect/iasb;} else {rsb=pb.scale;csb=pb.scale*iasb/aspect;}
  const texB=getShotTexture(pb.img);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,texB||blackTex);
  gl.uniform1i(u.uB,1);
  gl.uniform2f(u.uBUV,0.5+(0.5-pb.focus[0])*csb+pb.ox,0.5+(pb.focus[1]-0.5)*csb-pb.oy);
  gl.uniform2f(u.uBR,csb,rsb); gl.uniform1f(u.uBRot,0);

  // shot C (rarely used, keep black)
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,blackTex);
  gl.uniform1i(u.uC,2); gl.uniform2f(u.uCUV,0.5,0.5); gl.uniform2f(u.uCR,1,1); gl.uniform1f(u.uCRot,0);

  if(inWin && tr!=='cut' && prevIdx>=0){
    const p=clamp((t-(shot.start-d/2))/d,0,1);
    gl.uniform1i(u.uT,TID[tr]); gl.uniform1f(u.uP,p);
    gl.uniform1f(u.uAOp,1.0); gl.uniform1f(u.uBOp,1.0); gl.uniform1f(u.uCOp,0.0);
  } else {
    gl.uniform1i(u.uT,0); gl.uniform1f(u.uP,1.0);
    gl.uniform1f(u.uAOp,0.0); gl.uniform1f(u.uBOp,1.0); gl.uniform1f(u.uCOp,0.0);
  }
  drawQuad();

  // bloom downsample (1/4 res)
  gl.bindFramebuffer(gl.FRAMEBUFFER,downFBO.f); gl.viewport(0,0,downW,downH);
  gl.useProgram(progDown.p); glProgram=progDown.p;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneFBO.t);
  gl.uniform1i(progDown.u.uTex,0); gl.uniform2f(progDown.u.uRes,sceneW,sceneH);
  drawQuad();
  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomFBO.f); gl.viewport(0,0,bloomW,bloomH);
  gl.useProgram(progBloom.p); glProgram=progBloom.p;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,downFBO.t);
  gl.uniform1i(progBloom.u.uTex,0); gl.uniform2f(progBloom.u.uRes,downW,downH);
  drawQuad();

  // text overlay -> texture
  renderOverlay(t);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texText);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,overlayCanvas); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);

  // final post
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
  gl.useProgram(progPost.p); glProgram=progPost.p;
  const pu=progPost.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneFBO.t); gl.uniform1i(pu.uScene,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,bloomFBO.t); gl.uniform1i(pu.uBloom,1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D,texText); gl.uniform1i(pu.uText,2);
  gl.uniform2f(pu.uRes,W,H); gl.uniform1f(pu.uTime,t); gl.uniform1f(pu.uFrame,frame);
  const P=g.params;
  gl.uniform1f(pu.uSat,P.sat); gl.uniform1f(pu.uContrast,P.contrast); gl.uniform1f(pu.uExposure,P.exposure);
  gl.uniform1f(pu.uCool,P.cool); gl.uniform1f(pu.uWarm,P.warm); gl.uniform1f(pu.uCrush,P.crush);
  gl.uniform1f(pu.uRed,P.red); gl.uniform1f(pu.uScan,P.scan);
  gl.uniform1f(pu.uLetterbox,P.letterbox); gl.uniform1f(pu.uKick,kick); gl.uniform1f(pu.uAspect,W/H);
  drawQuad();
}

/* ============================================================
   CANVAS2D OVERLAY  (HUD + LYRICS + EVENTS + EDITORIAL)
   ============================================================ */
let overlayCanvas, octx;
const KW=['cloud','on-prem','private','local','firewall','denied','tenant','sovereign','enterprise','root','sudo','air-gapped','pokee','self-hosted','control','secure','deployed','building','rope','keys','trust'];
const isKW=(w)=>{ const s=w.toLowerCase().replace(/[.,!]/g,''); return KW.some(k=>s.indexOf(k)>=0); };

function fontStack(){
  return {
    mono:(w,s)=>`${w||400} ${s}px 'JetBrains Mono',monospace`,
    inter:(w,s,it)=>`${w||600} ${s}px ${it?'italic ':''}'Inter Tight',sans-serif`,
    bodoni:(w,s,it)=>`${w||400} ${s}px ${it?'italic ':''}'Bodoni Moda',serif`,
    anton:(s)=>`400 ${s}px 'Anton',sans-serif`
  };
}

function renderOverlay(t){
  const o=octx; const w=W,h=H; const minWH=Math.min(w,h);
  const vertical=h>w;
  o.clearRect(0,0,w,h);
  const F=fontStack();
  const g=gradeAt(t); const mood=g.mood;
  const kick=envVal(ENV.low,t);
  const rms=envVal(ENV.rms,t), high=envVal(ENV.high,t);

  /* ---------- camera shake (chant) ---------- */
  let shakeX=0,shakeY=0;
  const ch=activeChant(t);
  if(ch){ for(const s of ch.stamps){ const dt=t-s.t; if(dt<0.2){ const a=6*Math.exp(-dt/0.06);
    shakeX+=(rand(s.seed,1)-0.5)*a; shakeY+=(rand(s.seed,2)-0.5)*a; } } }
  o.save(); o.translate(shakeX,shakeY);

  /* ---------- HUD ---------- */
  const hudOp=baseHUDOp(mood,kick,t);
  if(hudOp>0.01) drawHUD(o,w,h,minWH,vertical,t,mood,kick,rms,high,hudOp,F);

  /* ---------- EDITORIAL: section cards + furniture ---------- */
  drawEditorial(o,w,h,minWH,vertical,t,mood,F);

  /* ---------- LYRICS ---------- */
  drawLyrics(o,w,h,minWH,vertical,t,mood,F);

  /* ---------- EVENTS ---------- */
  drawEvents(o,w,h,minWH,vertical,t,F);

  o.restore();
}

function baseHUDOp(mood,kick,t){
  let base={vault:0.9,drop:0.7,verse:0.55,build:0.7,chorus:0.35,bridge:0.25,denied:0.9,outro:0.8}[mood]||0.5;
  if(mood==='chorus'&&kick>0.4) base*= (0.7+0.3*Math.sin(t*40)); // flicker
  return base;
}

function drawHUD(o,w,h,minWH,vertical,t,mood,kick,rms,high,hudOp,F){
  const inset=minWH*0.04;
  const ivory=`rgba(244,239,230,${0.7*hudOp})`;
  const red=mood==='denied'?`rgba(225,37,27,${0.9*hudOp})`:`rgba(225,37,27,${0.7*hudOp})`;
  const mono=F.mono;
  const fs=Math.max(13,minWH*0.014*1.35);
  o.lineWidth=1;
  // corner brackets
  const bl=minWH*0.03;
  o.strokeStyle=ivory; o.globalAlpha=1;
  const corners=[[inset,inset,1,1],[w-inset,inset,-1,1],[inset,h-inset,1,-1],[w-inset,h-inset,-1,-1]];
  for(const [x,y,sx,sy] of corners){
    o.beginPath(); o.moveTo(x,y+sy*bl); o.lineTo(x,y); o.lineTo(x+sx*bl,y); o.stroke();
  }
  // top-left
  o.fillStyle=ivory; o.font=mono(400,fs); o.textBaseline='top';
  o.fillText('POKEE \u25CF ON-PREM', inset*1.3, inset*1.3);
  o.fillStyle=red; o.font=mono(400,fs*0.85);
  o.fillText('NODE-01 \u00B7 SECURE ENCLAVE', inset*1.3, inset*1.3+fs*1.4);
  // top-right timecode
  const tc=timecode(t);
  o.textAlign='right'; o.fillStyle=ivory; o.font=mono(400,fs);
  o.fillText('TC '+tc, w-inset*1.3, inset*1.3);
  o.fillStyle=red; o.font=mono(400,fs*0.85);
  o.fillText('AIR-GAPPED', w-inset*1.3, inset*1.3+fs*1.4);
  o.textAlign='left';
  // bottom-right meters
  const brx=w-inset*1.3, bry=h-inset*1.3;
  o.textAlign='right'; o.fillStyle=ivory; o.font=mono(400,fs*0.9);
  o.fillText('UPLINK: NONE', brx, bry-fs*3.4);
  o.fillText('EGRESS 0.00 KB/S', brx, bry-fs*2.2);
  o.fillText('TENANCY: SINGLE', brx, bry-fs*1.0);
  // 16-bar meter
  const mw=minWH*0.14*1.35, bh=minWH*0.012*1.35, gap=minWH*0.004;
  for(let i=0;i<16;i++){ const x=brx-mw+i*(mw/16)+gap*0.5; const y=bry-fs*0.2;
    const lv=Math.max(rms,high); const on=i/16<lv;
    o.fillStyle=on?(i>12?red:ivory):`rgba(244,239,230,${0.15*hudOp})`;
    o.fillRect(x,y, (mw/16)-gap*0.5, bh);

  o.font=mono(400,fs*0.82);
  const lines=authLines(t,4);
  for(let i=0;i<lines.length;i++){ const y=aly-fs*0.9*(lines.length-1-i);
    o.fillStyle=`rgba(244,239,230,${(0.55-i*0.1)*hudOp})`;
    o.fillText(lines[i], alx, y);
  }
  // scanline sweep (every 2 bars ~ 1.6 bar)
  const barDur=2*60/(TL.tempo||143.55)*4; // 2 bars of 4 beats
  const sweepT=(t%barDur)/barDur;
  const sy=sweepT*h;
  const grd=o.createLinearGradient(0,sy-8,0,sy+8);
  grd.addColorStop(0,`rgba(244,239,230,0)`);
  grd.addColorStop(0.5,`rgba(244,239,230,${0.12*hudOp})`);
  grd.addColorStop(1,`rgba(244,239,230,0)`);
  o.fillStyle=grd; o.fillRect(0,sy-8,w,16);
  o.globalAlpha=1;
}

function timecode(t){
  const total=Math.floor(t*24);
  const f=total%24, s=Math.floor(total/24)%60, m=Math.floor(total/1440)%60, h=Math.floor(total/86400);
  const p=n=>String(n).padStart(2,'0');
  return `${p(h)}:${p(m)}:${p(s)}:${p(f)}`;
}
function authLines(t,n){
  const beat=Math.floor(t* (TL.tempo||143.55)/60);
  const templates=[
    (i)=>`[auth] ${String(beat+i).padStart(4,'0')}:14:07 tenant=single status=OK`,
    (i)=>`[fw] drop 10.0.4.${12+i} \u2192 :443`,
    (i)=>`[agent] PokeeClaw perimeter scan \u2713`,
    (i)=>`[node] heartbeat 0ms \u00B7 air-gap intact`,
    (i)=>`[ten] single-tenant lock held \u2713`,
    (i)=>`[egress] 0.00 KB/s \u00B7 none permitted`,
    (i)=>`[vault] key rotation cycle ${i+1} complete`,
    (i)=>`[claw] no external handshake \u2713`
  ];
  const out=[];
  for(let i=0;i<n;i++){ const idx=(beat-i+100000)%templates.length; out.push(templates[idx](i)); }
  return out;

/* ---------- EDITORIAL ---------- */
const SECTION_TITLES={intro:'I. THE VAULT',drop:'II. VELVET ROPE',verse1:'III. HARD DECLINE',prehook:'IV. THE KEYS',
  chorus1:'V. ON-PREM',verse2:'VI. SINGLE-TENANT',bridge:'VII. NIGHT SHIFT',denied:'VIII. HANDSHAKE FAILED',

/* ---------- LYRICS ---------- */
function activeLyric(t){

function drawSung(o,w,h,minWH,vertical,t,L,F){

}
function wrapWords(o,words,maxLines,maxW,F,fs){

    o.font=kw?F.bodoni(700,fs*1.12,true):F.inter(600,fs);
    const ww=o.measureText(wd.text).width;
    const add=cur.length? ww+fs*0.28 : ww;
    if(curW+add>maxW && cur.length){ lines.push(cur); cur=[wd]; curW=ww; }
    else { cur.push(wd); curW+=add; }

  }

}

function drawWhisper(o,w,h,minWH,vertical,t,L,F){

      const p=clamp((t-wd.s)/0.12,0,1); if(t<wd.s-0.001) return;
      const e=easeOutExpo(p); const sc=1.35-0.35*e;

      const jit=(1-e)*4;
      o.font=F.anton(fs);

    o.fillStyle=`rgba(59,226,138,${e*0.4})`; o.fillText(wd.text.toUpperCase(),jit,0);
    o.fillStyle=`rgba(244,239,230,${e})`; o.fillText(wd.text.toUpperCase(),0,0);

function drawTranscript(o,w,h,minWH,vertical,t,L,kind,F){

  const blink=Math.floor(t*2)%2===0;

    o.fillStyle='rgba(244,239,230,0.8)';

function wrapPlain(o,text,maxW){

}
/* ---------- CHANT (DENIED stamps) ---------- */
function activeChant(t){
  for(let i=0;i<LYRICS.length;i++){ const L=LYRICS[i];if(L.kind==='chant'&&t>=L.start&&t<=L.end){
    const words=L.words||[]; const stamps=[];
    for(const wd of words){ if(t>=wd.s){ stamps.push({t:wd.s,seed:Math.floor(wd.s*1000)}); } }
    return {stamps,end:L.end,section:L.section};
  } }

}
function drawChant(o,w,h,minWH,vertical,t,F){
  const ch=activeChant(t); if(!ch) return;
  const maxStamps=14; const stamps=ch.stamps.slice(-maxStamps);
  const glitchOut=clamp((t-(ch.end-0.4))/0.4,0,1);
  stamps.forEach((s,i)=>{
    const p=clamp((t-s.t)/0.15,0,1); const e=easeOutExpo(p);
    const seed=s.seed+i*31;
    const px=w*(0.15+rand(seed,1)*0.7);
    const py=h*(0.15+rand(seed,2)*0.6);
    const rot=(rand(seed,3)-0.5)*0.28; // ±8°
    const fs=minWH*0.06;
    o.save();
    o.translate(px,py); o.rotate(rot); o.scale(e,e);
    const glx=glitchOut>0? (rand(seed,9)-0.5)*glitchOut*30 : 0;
    o.translate(glx,0);
    o.textAlign='center'; o.textBaseline='middle';
    // double border box
    o.font=F.anton(fs);
    const tw=o.measureText('DENIED').width;
    const bw=tw+fs*0.8, bh=fs*1.4;
    o.strokeStyle=`rgba(225,37,27,${0.9*(1-glitchOut)})`; o.lineWidth=3;
    o.strokeRect(-bw/2,-bh/2,bw,bh);
    o.strokeStyle=`rgba(225,37,27,${0.5*(1-glitchOut)})`; o.lineWidth=1;
    o.strokeRect(-bw/2+5,-bh/2+5,bw-10,bh-10);
    // ink speckle
    for(let k=0;k<20;k++){ const sx=(rand(seed*10+k,5)-0.5)*bw; const sy=(rand(seed*10+k,6)-0.5)*bh;
      o.fillStyle=`rgba(225,37,27,${0.3*(1-glitchOut)})`; o.fillRect(sx,sy,2,2); }
    o.fillStyle=`rgba(225,37,27,${0.92*(1-glitchOut)})`;
    o.fillText('DENIED',0,0);
    o.restore();
  });
}

/* ---------- EVENTS ---------- */
function drawEvents(o,w,h,minWH,vertical,t,F){
  for(const ev of EVENTS){
    if(t<ev.t||t>ev.t+ev.dur) continue;
    const p=clamp((t-ev.t)/ev.dur,0,1);
    const inP=easeOutExpo(clamp(p/0.25,0,1));
    const outP=clamp((p-0.75)/0.25,0,1);
    const alpha=inP*(1-outP);
    if(alpha<=0.01) continue;
    const cx=w/2, cy=h/2;
    switch(ev.type){
      case 'boot': drawBoot(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'speaker': drawSpeaker(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'keycard': drawKeycard(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'denied': drawDenied(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'warn': drawWarn(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'firewall': drawFirewall(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'notify': drawNotify(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'ok': drawOk(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'redact': drawRedact(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'drop': drawDrop(o,w,h,minWH,vertical,t,ev,alpha,F); break;
      case 'end': drawEnd(o,w,h,minWH,vertical,t,ev,alpha,F); break;
    }
  }
}
function drawBoot(o,w,h,minWH,vertical,t,ev,alpha,F){

}
function drawRedact(o,w,h,minWH,vertical,t,ev,alpha,F){
  const fs=minWH*0.022; const x=w*0.2, y=h*0.5, bw=w*0.6, bh=fs*1.4;
  o.font=F.mono(400,fs); const tw=o.measureText(ev.text).width;
  o.fillStyle=`rgba(244,239,230,${0.85*alpha})`; o.textAlign='left'; o.textBaseline='middle';
  o.fillText(ev.text, x, y);
  const redP=easeInOutCubic(clamp(alpha/0.8,0,1));
  o.fillStyle=`rgba(11,15,26,${alpha})`;
  o.fillRect(x-fs*0.3, y-fs*0.7, (tw+fs*0.6)*redP, fs*1.4);
}
function drawDrop(o,w,h,minWH,vertical,t,ev,alpha,F){
  const fs=minWH*0.12;
  const sc=1.3-0.3*easeOutExpo(alpha);
  o.save(); o.translate(w/2,h/2); o.scale(sc,sc);
  o.font=F.anton(fs); o.textAlign='center'; o.textBaseline='middle';
  o.fillStyle=`rgba(244,239,230,${alpha})`; o.fillText('ON-PREM',0,0);
  o.restore();
  // shockwave ring
  const ringP=easeOutExpo(alpha);
  const ringR=ringP*Math.max(w,h)*0.6;
  o.strokeStyle=`rgba(225,37,27,${(1-alpha)*0.8})`; o.lineWidth=3;
  o.beginPath(); o.arc(w/2,h/2,ringR,0,Math.PI*2); o.stroke();
}
function drawEnd(o,w,h,minWH,vertical,t,ev,alpha,F){
  const fade=clamp((t-ev.t)/0.5,0,1);
  o.save(); o.fillStyle=`rgba(11,15,26,${0.85*fade})`; o.fillRect(0,0,w,h);
  const cx=w/2, cy=h/2;
  o.textAlign='center'; o.textBaseline='middle';
  o.font=F.bodoni(700,minWH*0.16); o.fillStyle=`rgba(244,239,230,${fade})`;
  o.fillText('POKEE', cx, cy-minWH*0.08);
  o.font=F.anton(minWH*0.05); o.fillStyle=`rgba(225,37,27,${fade})`;
  // wide tracking
  const ot='O N - P R E M'; o.fillText(ot, cx, cy+minWH*0.02);
  // Inter Tight 300 italic with wide tracking
  const tag='STAYS IN THE BUILDING.';
  o.font=F.inter(300,minWH*0.022,true);
  o.fillStyle=`rgba(244,239,230,${0.7*fade})`;
  // manual wide tracking
  let tagW=0; const tagChars=tag.split('');
  const tfs=minWH*0.022; const tgap=tfs*0.35;
  let tagTotal=0; const tws=[];
  for(const ch of tagChars){ o.font=F.inter(300,tfs,true); const cw=o.measureText(ch).width; tws.push(cw); tagTotal+=cw+tgap; }
  let tx=cx-tagTotal/2;
  for(let i=0;i<tagChars.length;i++){ o.font=F.inter(300,tfs,true); o.textAlign='left'; o.fillText(tagChars[i],tx,cy+minWH*0.08); tx+=tws[i]+tgap; }
  o.textAlign='center';
  o.restore();
  // fade to black near duration
  const toBlack=clamp((t-(DUR-1.5))/1.5,0,1);
  if(toBlack>0){ o.fillStyle=`rgba(0,0,0,${toBlack})`; o.fillRect(0,0,w,h); }
}
function roundRect(o,x,y,w,h,r){ o.beginPath(); o.moveTo(x+r,y); o.arcTo(x+w,y,x+w,y+h,r);
  o.arcTo(x+w,y+h,x,y+h,r); o.arcTo(x,y+h,x,y,r); o.arcTo(x,y,x+w,y,r); o.closePath(); }

/* ============================================================
   INIT / LOADER
   ============================================================ */
const RENDER_MODE = new URLSearchParams(location.search).get('render')==='1';

const fonts=[];
function addFont(family,weight,style,src){ fonts.push({family,weight,style,src}); }
addFont('Bodoni Moda',400,'normal','url("fonts/bodoni-moda-latin-400-normal.woff2") format("woff2")');
addFont('Bodoni Moda',400,'italic','url("fonts/bodoni-moda-latin-400-italic.woff2") format("woff2")');
addFont('Bodoni Moda',700,'normal','url("fonts/bodoni-moda-latin-700-normal.woff2") format("woff2")');
addFont('Bodoni Moda',700,'italic','url("fonts/bodoni-moda-latin-700-italic.woff2") format("woff2")');
addFont('Anton',400,'normal','url("fonts/anton-latin-400-normal.woff2") format("woff2")');
addFont('Inter Tight',300,'normal','url("fonts/inter-tight-latin-300-normal.woff2") format("woff2")');
addFont('Inter Tight',300,'italic','url("fonts/inter-tight-latin-300-italic.woff2") format("woff2")');
addFont('Inter Tight',600,'normal','url("fonts/inter-tight-latin-600-normal.woff2") format("woff2")');
addFont('Inter Tight',900,'normal','url("fonts/inter-tight-latin-900-normal.woff2") format("woff2")');
addFont('JetBrains Mono',400,'normal','url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2")');
addFont('JetBrains Mono',700,'normal','url("fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2")');

let sceneFBO,downFBO,bloomFBO,blackTex;
let sceneW,sceneH,downW,downH;

function initGL(){
  gl=canvas.getContext('webgl',{preserveDrawingBuffer:true,antialias:false,alpha:false});
  if(!gl) return false;
  progMain=program(VS,FS_MAIN2);
  progBloom=program(VS,FS_BLOOM);
  progDown=program(VS,FS_DOWN);
  progPost=program(VS,FS_POST);
  // robustness: verify all programs linked before declaring success
  const ok=progMain&&progBloom&&progDown&&progPost&&
    gl.getProgramParameter(progMain.p,gl.LINK_STATUS)&&
    gl.getProgramParameter(progBloom.p,gl.LINK_STATUS)&&
    gl.getProgramParameter(progDown.p,gl.LINK_STATUS)&&
    gl.getProgramParameter(progPost.p,gl.LINK_STATUS);
  if(!ok){ console.error('POKEE: one or more shader programs failed to link.'); return false; }
  quadBuf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  blackTex=makeTex(1,1); gl.bindTexture(gl.TEXTURE_2D,blackTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
  glOK=true; return true;
}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,1.5);
  W=Math.floor(window.innerWidth*dpr); H=Math.floor(window.innerHeight*dpr);
  canvas.width=W; canvas.height=H; canvas.style.width=window.innerWidth+'px'; canvas.style.height=window.innerHeight+'px';
  if(!glOK) return;
  sceneW=W; sceneH=H;
  downW=Math.max(1,Math.floor(W/2)); downH=Math.max(1,Math.floor(H/2));
  bloomW=Math.max(1,Math.floor(W/4)); bloomH=Math.max(1,Math.floor(H/4));
  if(sceneFBO){ gl.deleteFramebuffer(sceneFBO.f); gl.deleteTexture(sceneFBO.t); }
  if(downFBO){ gl.deleteFramebuffer(downFBO.f); gl.deleteTexture(downFBO.t); }
  if(bloomFBO){ gl.deleteFramebuffer(bloomFBO.f); gl.deleteTexture(bloomFBO.t); }
  sceneFBO=makeFBO(sceneW,sceneH); downFBO=makeFBO(downW,downH); bloomFBO=makeFBO(bloomW,bloomH);
  // clear texture cache on resize (dimensions unchanged but safe)
  for(const k of texLRU.keys()){ const e=texLRU.get(k); if(e) gl.deleteTexture(e.tex); }
  texLRU.clear(); texOrder=[];
  overlayCanvas.width=W; overlayCanvas.height=H;
  if(texText){ gl.deleteTexture(texText); }
  texText=makeTex(W,H);
}

function loadFonts(){
  return Promise.all(fonts.map(f=>new Promise((res,rej)=>{
    const ff=new FontFace(f.family,f.src,{weight:String(f.weight),style:f.style});
    ff.load().then(loaded=>{ document.fonts.add(loaded); res(); }).catch(rej);
  })));
}
function loadImages(){
  return Promise.all(IMAGES.map(img=>new Promise((res)=>{
    if(!img) return res();
    const el=new Image(); el.crossOrigin='anonymous';
    el.onload=()=>{ img._el=el; if(el.decode) el.decode().then(res).catch(res); else res(); };
    el.onerror=()=>{ img._el=null; res(); };
    el.src=img.file;
  })));
}

async function init(){
  resize();
  window.addEventListener('resize',()=>{ resize(); });
  overlayCanvas=document.createElement('canvas');
  octx=overlayCanvas.getContext('2d');
  try{ await loadFonts(); }catch(e){ console.error('font load failed',e); }
  await loadImages();
  if(!initGL()){ // fallback: 2D only
    canvas.getContext('2d'); glOK=false;
  } else { resize(); }
  if(glOK && !texText){ texText=makeTex(W,H); }
  readyResolve();
  const readyEl=document.getElementById('ready');
  if(readyEl){ readyEl.style.opacity='0'; setTimeout(()=>{ if(readyEl.parentNode) readyEl.parentNode.removeChild(readyEl); },700); }
  if(RENDER_MODE){ /* no loop */ }
  else startPreview();
}

/* ---------- ENGINE contract ---------- */
let _resolveReady=null;
const readyPromise=new Promise(r=>{ _resolveReady=r; });
function readyResolve(){ _resolveReady&&_resolveReady(); }

window.ENGINE={
  ready:readyPromise,
  renderFrame:(t)=>{ renderFrame(t); },
  duration:DUR
};

/* ---------- preview mode ---------- */
let audio=null, playing=false, rafId=null, uiHidden=false, hideTimer=null;
function startPreview(){
  const ui=document.getElementById('ui');
  ui.classList.remove('hidden');
  audio=new Audio('song.mp3'); audio.preload='auto';
  const playBtn=document.getElementById('play');
  const playLbl=document.getElementById('playLbl');
  const scrub=document.getElementById('scrub');
  const fill=document.getElementById('scrubFill');
  const knob=document.getElementById('scrubKnob');
  function showUI(){ ui.classList.remove('hidden'); uiHidden=false;
    clearTimeout(hideTimer); hideTimer=setTimeout(()=>{ if(playing) ui.classList.add('hidden'); },2500); }
  function tick(){
    if(!playing) return;
    const t=audio.currentTime;
    renderFrame(t);
    const pct=(t/DUR)*100;
    fill.style.width=pct+'%'; knob.style.left=pct+'%';
    rafId=requestAnimationFrame(tick);
  }
  function setPlay(p){
    playing=p;
    if(p){ audio.play().catch(()=>{}); playLbl.textContent='PAUSE'; playBtn.querySelector('.tri').textContent='\u25AE';
      ui.classList.add('hidden'); showUI(); tick(); }
    else { audio.pause(); playLbl.textContent='PLAY'; playBtn.querySelector('.tri').textContent='\u25B6';
      cancelAnimationFrame(rafId); ui.classList.remove('hidden'); }
  }
  playBtn.addEventListener('click',(e)=>{ e.stopPropagation(); setPlay(!playing); });
  scrub.addEventListener('click',(e)=>{
    const r=scrub.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width;
    audio.currentTime=clamp(x,0,1)*DUR; renderFrame(audio.currentTime);
    fill.style.width=(x*100)+'%'; knob.style.left=(x*100)+'%';
  });
  document.addEventListener('keydown',(e)=>{ if(e.code==='Space'){ e.preventDefault(); setPlay(!playing); } });
  document.addEventListener('mousemove',showUI);
  renderFrame(0);
}

init();
})();
</script>
